name: CI

on:
	push:
		branches: [main]
	pull_request:

jobs:
	verify:
		runs-on: ubuntu-latest
		steps:
			- uses: actions/checkout@v4
			- uses: oven-sh/setup-bun@v2
				with:
					bun-version: 1.4.0
			- run: bun install
			- run: bun run build
			- run: bun run typecheck
			- name: Per-packet verification (every packet in scripts/packet-list.ts)
				run: bun run verify:packet --all
			- name: Release readiness
				run: bun scripts/release-check.ts
				env:
					# CI has no live credentials: every live gate reports BLOCKED,
					# which never fails the build.
					CI: 'true'
