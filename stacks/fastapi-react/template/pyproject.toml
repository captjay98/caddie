[project]
name = "forge-fastapi-template"
version = "0.1.0"
description = "Forge FastAPI + React template with a uv-managed Python backend."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
