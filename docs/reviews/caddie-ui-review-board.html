<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caddie UI · A–Z review board</title>
<meta name="description" content="Screen-by-screen replica of the shipped Caddie interface with as-is / redesigned comparison, data-state switching and decision capture.">
<!-- No remote fonts. The board reproduces the product's type grammar, and its own
     screen 16 finding is that the app self-hosts Inter + IBM Plex Mono via @fontsource
     and "nothing is fetched from a CDN at runtime." A single-file review artifact should
     hold that line too, so --font-ui / --font-mono resolve to their system fallbacks
     (ui-sans-serif/system-ui, ui-monospace/SFMono/Menlo) rather than a Google Fonts link. -->
<style>
/* ============================================================================
   1. TOKENS
   Seed set defines the halo identity (values quoted from
   caddie-forge/packages/ui/src/tokens.css). Everything below the seed block is
   derived with color-mix() so both themes stay coherent. The reference-value
   block is the only place a colour is written as a literal; section 2 quotes
   source values by name, and no rendered markup restates a hex.
   ========================================================================== */

:root {
  /* --- seed sources -------------------------------------------------------
     Quoted from caddie-forge/packages/ui/src/tokens.css (the shipped dark set),
     the light pairing this board proposes, and the literals quoted from source
     in section 2. This is the only place in the file where a colour is written
     as a hex literal: the live seed layer, the light fallback, the as-is palette
     and the before/after token table all read back from here, so a value can
     never be restated differently in two places.
     ------------------------------------------------------------------------ */
  --seed-ref-dark-bg: #090b10;
  --seed-ref-dark-surface: #101319;
  --seed-ref-dark-raised: #151922;
  --seed-ref-dark-lift: #1b2029;
  --seed-ref-dark-fg: #e6e9ef;
  --seed-ref-dark-muted: #8b93a3;
  --seed-ref-dark-primary: #4d9fff;
  --seed-ref-dark-primary-deep: #2f7ddd;
  --seed-ref-dark-accent: #f0a83c;
  --seed-ref-dark-ok: #3ecf8e;
  --seed-ref-dark-danger: #ff7a83;
  --seed-ref-light-bg: #f6f8fc;
  --seed-ref-light-surface: #ffffff;
  --seed-ref-light-raised: #f1f4fa;
  --seed-ref-light-lift: #e7ecf5;
  --seed-ref-light-fg: #0b101a;
  --seed-ref-light-muted: #4c5768;
  /* One deliberate step away from the shipped light pairing: see screen 16. */
  --seed-ref-light-primary: #155fbe;
  --seed-ref-light-primary-deep: #0f4a99;
  --seed-ref-light-accent: #9c5a05;
  --seed-ref-light-ok: #007b44;
  --seed-ref-light-danger: #c13846;
  /* The shipped light action pair, held here as data because screen 16 argues
     against it and the argument has to quote the values it rejects. */
  --seed-ref-shipped-light-action: #1a72e8;
  --seed-ref-shipped-light-action-deep: #155fbe;
  --seed-ref-asis-border: #ccc;
  --seed-ref-asis-danger: #a00;
  --seed-ref-asis-muted: #556;
  --seed-ref-asis-bg: #eef;
  --seed-ref-asis-ok-bg: #e6f6e6;
  --seed-ref-asis-danger-bg: #fde5e5;
  --seed-ref-asis-chip: #f2f2f2;
  --seed-ref-asis-rule: #eee;
  --seed-ref-asis-warn-edge: #d90;
  --seed-ref-asis-conflict-edge: #a0a;
  --seed-ref-asis-evidence-edge: #dde;
  --seed-ref-asis-warn-text: #860;
  --seed-ref-asis-superseded-text: #a60;
  --seed-ref-asis-quote-edge: #ccd;
  --seed-ref-asis-verified-local-bg: #eef6e6;
  --seed-ref-asis-declared-bg: #fff4d6;
  --seed-ref-asis-conflict-bg: #f2d6f5;
  /* Brand marks keep their official colours on both themes, exactly as
     client/auth.ts draws them. */
  --seed-ref-brand-google-blue: #4285f4;
  --seed-ref-brand-google-green: #34a853;
  --seed-ref-brand-google-yellow: #fbbc05;
  --seed-ref-brand-google-red: #ea4335;
  --seed-ref-asis-surface: #fff;
  --seed-ref-asis-ink: #000;

  /* --- seed --------------------------------------------------------------- */
  --seed-bg: var(--seed-ref-dark-bg);
  --seed-surface: var(--seed-ref-dark-surface);
  --seed-raised: var(--seed-ref-dark-raised);
  --seed-lift: var(--seed-ref-dark-lift);
  --seed-fg: var(--seed-ref-dark-fg);
  --seed-muted: var(--seed-ref-dark-muted);
  --seed-primary: var(--seed-ref-dark-primary);
  --seed-primary-deep: var(--seed-ref-dark-primary-deep);
  --seed-accent: var(--seed-ref-dark-accent);
  --seed-ok: var(--seed-ref-dark-ok);
  --seed-danger: var(--seed-ref-dark-danger);
  /* Surface contrast: every hairline, rule and divider is a percentage of the
     foreground, so one seed owns how much the structure separates from the
     background in any appearance. */
  --seed-line-strength: 13%;
  --seed-radius: 10px;
  /* One radius decision, not two: controls sit two steps below surfaces, so a
     radius change keeps the same relationship instead of needing a second
     control to be nudged in lockstep. */
  --seed-control-radius: calc(var(--seed-radius) - 2px);

  /* --- derived surfaces --------------------------------------------------- */
  --color-ink: var(--seed-bg);
  --color-panel: var(--seed-surface);
  --color-raised: var(--seed-raised);
  --color-lift: var(--seed-lift);
  --color-bright: var(--seed-fg);
  --color-muted: var(--seed-muted);
  --color-action: var(--seed-primary);
  --color-action-deep: var(--seed-primary-deep);
  --color-ok: var(--seed-ok);
  --color-warn: var(--seed-accent);
  --color-danger: var(--seed-danger);
  --color-line: color-mix(in srgb, var(--seed-fg) var(--seed-line-strength), transparent);
  --color-line-soft: color-mix(in srgb, var(--seed-fg) calc(var(--seed-line-strength) * .538), transparent);
  --color-line-strong: color-mix(in srgb, var(--seed-fg) calc(var(--seed-line-strength) * 1.692), transparent);
  --color-hairline: color-mix(in srgb, var(--seed-fg) calc(var(--seed-line-strength) * .385), transparent);
  --card-gradient: linear-gradient(180deg,
      color-mix(in srgb, var(--seed-raised) 70%, var(--seed-surface)),
      var(--seed-surface));
  --lift-shadow: inset 0 1px 0 color-mix(in srgb, var(--seed-fg) 4%, transparent);
  --horizon: radial-gradient(1200px 500px at 50% -10%,
      color-mix(in srgb, var(--seed-primary) 13%, transparent), transparent 60%);

  /* --- derived semantic tints -------------------------------------------- */
  --tint-action: color-mix(in srgb, var(--seed-primary) 12%, transparent);
  --tint-action-edge: color-mix(in srgb, var(--seed-primary) 25%, transparent);
  --tint-warn: color-mix(in srgb, var(--seed-accent) 12%, transparent);
  --tint-warn-edge: color-mix(in srgb, var(--seed-accent) 40%, transparent);
  --tint-ok: color-mix(in srgb, var(--seed-ok) 12%, transparent);
  --tint-ok-edge: color-mix(in srgb, var(--seed-ok) 40%, transparent);
  --tint-danger: color-mix(in srgb, var(--seed-danger) 12%, transparent);
  --tint-danger-edge: color-mix(in srgb, var(--seed-danger) 40%, transparent);

  /* --- type --------------------------------------------------------------- */
  --font-ui: "Inter", "Inter var", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SFMono", Menlo, monospace;
  /* The floor the annotations argue for, declared once rather than repeated as a
     per-selector literal: a label may sit at --r-label, but anything that carries
     an identifier, a state or a verdict must clear --r-meta. The product's own
     tiers are 10px and 10.5px (workspace.css 52, 88, 169, 358, 448, 482, 533, 605),
     which is why the as-is frames still render at those sizes — they reproduce the
     rule under review. Only redesigned frames read these two tokens. */
  --r-label: 11px;
  --r-meta: 12px;

  /* --- board metrics ------------------------------------------------------ */
  /* The board chrome is a review instrument, not a replica, so it keeps its own
     type scale: one base drives every chrome step below. These values used to sit
     between 9px and 12.5px, which stops being readable once the stage is narrow
     enough that the frame itself is scaled down. */
  --chrome-base: 13.5px;
  --chrome-mono: calc(var(--chrome-base) * 0.78);  /* kickers, chips, captions */
  --chrome-small: calc(var(--chrome-base) * 0.86); /* paths, facts, source refs */
  --chrome-text: calc(var(--chrome-base) * 0.96);  /* items, buttons, prose */
  --chrome-lead: var(--chrome-base);               /* screen verdict line */
  --chrome-title: calc(var(--chrome-base) * 1.33); /* screen h1 */
  /* Panel widths are a direct trade against preview size: every pixel here is a
     pixel the stage does not get, so the pair stays as tight as the raised type
     scale allows. Collapsing either panel hands its width back to the preview. */
  --rail-w: 280px;
  --side-w: 356px;
}

/* Fallback pairing: applies only when nothing is writing the seed layer (no
   JS, or the board attribute has been stripped by hand). While the board owns
   the seeds it writes the same eleven values inline, so the two theme paths can
   never disagree. */
:root[data-theme="light"]:not([data-seed-owner="board"]) {
  --seed-bg: var(--seed-ref-light-bg);
  --seed-surface: var(--seed-ref-light-surface);
  --seed-raised: var(--seed-ref-light-raised);
  --seed-lift: var(--seed-ref-light-lift);
  --seed-fg: var(--seed-ref-light-fg);
  --seed-muted: var(--seed-ref-light-muted);
  --seed-primary: var(--seed-ref-light-primary);
  --seed-primary-deep: var(--seed-ref-light-primary-deep);
  --seed-accent: var(--seed-ref-light-accent);
  --seed-ok: var(--seed-ref-light-ok);
  --seed-danger: var(--seed-ref-light-danger);
  --lift-shadow: 0 1px 2px color-mix(in srgb, var(--seed-bg) 100%, black 8%);
  --card-gradient: var(--seed-surface);
}

/* ============================================================================
   2. AS-IS DEFECT PALETTE — intentional, do not "fix"
   evidence/Drawer.tsx, discovery/Results.tsx, judge/Scorecard.tsx and
   submission/Package.tsx set colours as inline styles with literal hex and
   font-family: system-ui, so those four surfaces ignore data-theme entirely.
   The values below are quoted from source (section 1 reference block,
   --seed-ref-asis-*). They are deliberately NOT derived from the seed set:
   being theme-independent IS the defect we are reviewing.
   ========================================================================== */
:root {
  --asis-inline-border: var(--seed-ref-asis-border);
  --asis-inline-danger: var(--seed-ref-asis-danger);
  --asis-inline-muted: var(--seed-ref-asis-muted);
  --asis-inline-bg: var(--seed-ref-asis-bg);
  --asis-inline-ok-bg: var(--seed-ref-asis-ok-bg);
  --asis-inline-danger-bg: var(--seed-ref-asis-danger-bg);
  --asis-inline-chip: var(--seed-ref-asis-chip);
  --asis-inline-rule: var(--seed-ref-asis-rule);
  --asis-inline-warn-edge: var(--seed-ref-asis-warn-edge);
  --asis-inline-conflict-edge: var(--seed-ref-asis-conflict-edge);
  --asis-inline-evidence-edge: var(--seed-ref-asis-evidence-edge);
  --asis-inline-warn-text: var(--seed-ref-asis-warn-text);
  --asis-inline-superseded-text: var(--seed-ref-asis-superseded-text);
  --asis-inline-quote-edge: var(--seed-ref-asis-quote-edge);
  --asis-inline-verified-local-bg: var(--seed-ref-asis-verified-local-bg);
  --asis-inline-declared-bg: var(--seed-ref-asis-declared-bg);
  --asis-inline-conflict-bg: var(--seed-ref-asis-conflict-bg);
  --asis-inline-surface: var(--seed-ref-asis-surface);
  --asis-inline-ink: var(--seed-ref-asis-ink);
  --asis-system-stack: system-ui, sans-serif;
}

/* Official provider mark colours — fixed on both themes, as shipped. */
:root {
  --brand-google-blue: var(--seed-ref-brand-google-blue);
  --brand-google-green: var(--seed-ref-brand-google-green);
  --brand-google-yellow: var(--seed-ref-brand-google-yellow);
  --brand-google-red: var(--seed-ref-brand-google-red);
}

/* ============================================================================
   3. RESET + BOARD CHROME
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--color-ink);
  color: var(--color-bright);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--color-action); }
:focus-visible { outline: 2px solid var(--color-action); outline-offset: 2px; border-radius: 4px; }
svg { display: block; }

.board {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--side-w);
  grid-template-rows: auto minmax(0, 1fr);
  height: 100dvh;
  background: var(--color-ink);
  transition: grid-template-columns .22s ease;
}

/* Collapsing a panel takes its track to zero instead of removing it, so the
   stage gains the width and the frame can be drawn larger. Only meaningful in
   the three-column layout; stacked mode hides the panel outright. */
@media (min-width: 1041px) {
  .board[data-rail="closed"] { grid-template-columns: 0 minmax(0, 1fr) var(--side-w); }
  .board[data-side="closed"] { grid-template-columns: var(--rail-w) minmax(0, 1fr) 0; }
  .board[data-rail="closed"][data-side="closed"] { grid-template-columns: 0 minmax(0, 1fr) 0; }
}

/* --- board masthead ------------------------------------------------------- */
.board-head {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: .6rem 1rem;
  border-bottom: 1px solid var(--color-line-soft);
  background: var(--color-panel);
  flex-wrap: wrap;
}

.board-title {
  display: flex;
  align-items: baseline;
  gap: .55rem;
  min-width: 0;
}

.board-title .mark {
  font-family: var(--font-mono);
  font-size: var(--chrome-text);
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
}

.board-title .mark b { color: var(--color-action); font-weight: 600; }

.board-title .sub {
  font-size: var(--chrome-text);
  color: var(--color-muted);
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  align-items: center;
  gap: .7rem;
  margin-left: auto;
  flex-wrap: wrap;
}

.control-group {
  display: flex;
  align-items: center;
  gap: .35rem;
}

.control-label {
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--chrome-mono);
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--color-muted);
}

.seg {
  display: flex;
  border: 1px solid var(--color-line-soft);
  border-radius: var(--seed-control-radius);
  overflow: hidden;
  background: var(--color-raised);
}

.seg button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--color-muted);
  padding: .38rem .7rem;
  font-size: var(--chrome-text);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.seg button + button { border-left: 1px solid var(--color-line-soft); }

.seg button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--color-action) 16%, transparent);
  color: var(--color-action);
}

.board-note {
  font-family: var(--font-mono);
  font-size: var(--chrome-small);
  letter-spacing: .04em;
  color: var(--color-muted);
  border: 1px solid var(--color-line-soft);
  border-radius: 9999px;
  padding: 3px 10px;
  background: var(--color-raised);
}

/* A single button, not a segment: it drives both panels at once, and its label
   says which way it goes. */
.board-btn {
  border: 1px solid var(--color-line-soft);
  background: var(--color-raised);
  border-radius: var(--seed-control-radius);
  padding: .38rem .7rem;
  font-size: var(--chrome-text);
  font-weight: 600;
  color: var(--color-muted);
  cursor: pointer;
  white-space: nowrap;
}

.board-btn:hover { color: var(--color-bright); border-color: var(--color-line); }

.board-btn[aria-pressed="true"] {
  color: var(--color-action);
  border-color: var(--tint-action-edge);
  background: color-mix(in srgb, var(--color-action) 16%, transparent);
}

/* --- rail ----------------------------------------------------------------- */
.rail {
  grid-column: 1;
  border-right: 1px solid var(--color-line-soft);
  background: var(--color-panel);
  overflow-y: auto;
  padding: .7rem .55rem 2rem;
  min-width: 0;
  transition: opacity .18s ease, visibility .18s ease, padding-inline .22s ease;
}

/* A collapsed panel keeps its markup and scroll position — only the track and the
   paint go away — so re-opening returns to the same place in the A–Z list. The
   inline padding and border have to go too: a border-box box is never narrower
   than its own padding plus border, which would leave a stub sticking out of the
   zero track and push the document into horizontal scroll. */
.board[data-rail="closed"] .rail,
.board[data-side="closed"] .side {
  opacity: 0;
  visibility: hidden;
  overflow: hidden;
  padding-inline: 0;
  border-width: 0;
}

.rail h2 {
  margin: .2rem .6rem .55rem;
  font-family: var(--font-mono);
  font-size: var(--chrome-mono);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--color-muted);
}

.rail-item {
  display: grid;
  grid-template-columns: 1.9rem minmax(0, 1fr) auto;
  align-items: center;
  gap: .5rem;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  border-radius: var(--seed-control-radius);
  background: transparent;
  padding: .44rem .55rem;
  cursor: pointer;
  margin-bottom: 1px;
}

.rail-item:hover { background: color-mix(in srgb, var(--color-bright) 4%, transparent); }

.rail-item[aria-current="true"] {
  background: var(--tint-action);
  border-color: var(--tint-action-edge);
}

.rail-item .idx {
  font-family: var(--font-mono);
  font-size: var(--chrome-small);
  color: var(--color-muted);
  font-variant-numeric: tabular-nums;
}

.rail-item[aria-current="true"] .idx { color: var(--color-action); }

.rail-item .nm {
  font-size: var(--chrome-text);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rail-item .reach {
  font-family: var(--font-mono);
  font-size: var(--chrome-mono);
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--color-muted);
  border: 1px solid var(--color-line-soft);
  border-radius: 9999px;
  padding: 2px 7px;
  white-space: nowrap;
}

.rail-item .reach[data-reach="routed"] { color: var(--color-ok); border-color: var(--tint-ok-edge); }
.rail-item .reach[data-reach="unwired"] { color: var(--color-warn); border-color: var(--tint-warn-edge); }
.rail-item .reach[data-reach="missing"] { color: var(--color-danger); border-color: var(--tint-danger-edge); }

.rail-group-label {
  margin: .9rem .6rem .35rem;
  font-family: var(--font-mono);
  font-size: var(--chrome-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--color-muted);
  opacity: .8;
}

/* --- stage ---------------------------------------------------------------- */
.stage-wrap {
  grid-column: 2;
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--color-ink);
}

.screen-head {
  padding: .8rem 1rem .75rem;
  border-bottom: 1px solid var(--color-line-soft);
  background: var(--color-panel);
  display: grid;
  gap: .45rem;
}

.screen-head .row1 {
  display: flex;
  align-items: center;
  gap: .55rem;
  flex-wrap: wrap;
}

.screen-head h1 {
  margin: 0;
  font-size: var(--chrome-title);
  font-weight: 600;
  letter-spacing: -.01em;
}

.path {
  font-family: var(--font-mono);
  font-size: var(--chrome-small);
  color: var(--color-muted);
  background: var(--color-raised);
  border: 1px solid var(--color-line-soft);
  border-radius: 6px;
  padding: 2px 8px;
  overflow-wrap: anywhere;
}

.status-chip {
  font-family: var(--font-mono);
  font-size: var(--chrome-mono);
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  border-radius: 9999px;
  padding: 3px 9px;
  border: 1px solid var(--color-line-soft);
  color: var(--color-muted);
  background: var(--color-raised);
}

.status-chip[data-evidence="LOCAL VERIFIED"] { color: var(--color-action); border-color: var(--tint-action-edge); }
.status-chip[data-evidence="LIVE VERIFIED"] { color: var(--color-ok); border-color: var(--tint-ok-edge); }
.status-chip[data-evidence="IN PROGRESS"] { color: var(--color-warn); border-color: var(--tint-warn-edge); }
.status-chip[data-evidence="BLOCKED"] { color: var(--color-danger); border-color: var(--tint-danger-edge); }
.status-chip[data-evidence="SIMULATED"] { color: var(--color-warn); border-color: var(--tint-warn-edge); }
.status-chip[data-evidence="NOT STARTED"] { color: var(--color-muted); border-color: var(--color-line); }

.screen-head .verdict {
  margin: 0;
  font-size: var(--chrome-lead);
  color: var(--color-muted);
  max-width: 72ch;
  line-height: 1.55;
}

.screen-head .variant-line {
  display: flex;
  align-items: center;
  gap: .45rem;
  flex-wrap: wrap;
}

.stage {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
  justify-content: center;
  padding: 16px;
  background-image: var(--horizon);
  background-repeat: no-repeat;
}

/* Width and 1:1 both let the drawing leave the stage box: real screens scroll,
   and shrinking a 1440 composition until it all fits is what makes a replica
   feel miniature. */
.stage[data-zoom="actual"],
.stage[data-zoom="width"] {
  overflow: auto;
  place-items: start start;
  justify-content: start;
  align-content: start;
}

/* --- panel handles -------------------------------------------------------- */
/* The handles sit on the stage edge, outside both panels, so a collapsed panel
   is always reachable again. The chevron points the way the panel travels. */
.edge-toggle {
  position: absolute;
  top: 50%;
  z-index: 3;
  width: 24px;
  height: 52px;
  display: grid;
  place-items: center;
  margin-top: -26px;
  padding: 0;
  border: 1px solid var(--color-line-soft);
  background: var(--color-panel);
  color: var(--color-muted);
  cursor: pointer;
  transition: color .15s ease, background .15s ease, border-color .15s ease;
}

.edge-toggle:hover {
  color: var(--color-action);
  background: var(--color-raised);
  border-color: var(--tint-action-edge);
}

.edge-left {
  left: 0;
  border-left: 0;
  border-radius: 0 var(--seed-control-radius) var(--seed-control-radius) 0;
}

.edge-right {
  right: 0;
  border-right: 0;
  border-radius: var(--seed-control-radius) 0 0 var(--seed-control-radius);
}

.edge-toggle svg { transform: rotate(180deg); transition: transform .2s ease; }
.edge-right svg { transform: none; }
.board[data-rail="closed"] .edge-left svg { transform: none; }
.board[data-side="closed"] .edge-right svg { transform: rotate(180deg); }

.edge-toggle .edge-key {
  position: absolute;
  left: 50%;
  bottom: -17px;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: var(--chrome-mono);
  letter-spacing: .06em;
  color: var(--color-muted);
  opacity: 0;
  transition: opacity .15s ease;
  pointer-events: none;
}

.edge-toggle:hover .edge-key,
.edge-toggle:focus-visible .edge-key { opacity: 1; }

.screen-frame {
  /* the box follows the scaled drawing, so the caption under it stays attached */
  width: calc(var(--sw) * var(--fit, 1));
  height: calc(var(--sh) * var(--fit, 1));
  border: 1px solid var(--color-line-soft);
  border-radius: calc(var(--seed-radius) + 2px);
  overflow: hidden;
  box-shadow: 0 18px 44px -22px color-mix(in srgb, var(--seed-bg) 100%, black 60%);
  background: var(--color-ink);
}

.screen {
  transform: scale(var(--fit, 1));
  transform-origin: top left;
  width: var(--sw);
  height: var(--sh);
  overflow: auto;
  position: relative;
  /* The landing's fluid type scale is written in cqw, so it tracks the declared
     frame width (1440 or 390) instead of the browser window hosting the board. */
  container-type: inline-size;
  background: var(--color-ink);
  color: var(--color-bright);
  font-family: var(--font-ui);
}

/* Provenance note lives below the stage, outside the reproduced viewport, so it
   can never cover the composer or a primary control — and so it stays readable
   when Width or 1:1 lets the frame run past the stage box. */
.frame-caption {
  flex: 0 0 auto;
  margin: 0 auto .7rem;
  width: max-content;
  max-width: min(92%, 90ch);
  text-align: center;
  font-family: var(--font-mono);
  font-size: var(--chrome-small);
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--color-muted);
  background: var(--color-panel);
  border: 1px solid var(--color-line-soft);
  border-radius: 9999px;
  padding: 3px 11px;
}

.frame-caption:empty { display: none; }

.screen .sim-caption {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--color-muted);
  padding: .35rem .6rem;
}

.screen--mobile { font-size: 14px; }

/* --- side panel ----------------------------------------------------------- */
.side {
  grid-column: 3;
  border-left: 1px solid var(--color-line-soft);
  background: var(--color-panel);
  overflow-y: auto;
  padding: .9rem 1rem 2rem;
  min-width: 0;
  display: grid;
  gap: 1.15rem;
  align-content: start;
  transition: opacity .18s ease, visibility .18s ease, padding-inline .22s ease;
}

.side-block h3 {
  margin: 0 0 .45rem;
  font-family: var(--font-mono);
  font-size: var(--chrome-mono);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--color-muted);
}

.entry-facts {
  display: grid;
  gap: .35rem;
  font-size: var(--chrome-text);
  line-height: 1.5;
}

.entry-facts div {
  display: grid;
  grid-template-columns: 6rem minmax(0, 1fr);
  gap: .5rem;
}

.entry-facts dt,
.entry-facts .k {
  font-family: var(--font-mono);
  font-size: var(--chrome-small);
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--color-muted);
}

.entry-facts .v { color: var(--color-bright); overflow-wrap: anywhere; }

.fix-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: .6rem;
  counter-reset: fix;
}

.fix-list li {
  counter-increment: fix;
  font-size: var(--chrome-text);
  line-height: 1.55;
  display: grid;
  grid-template-columns: 1.9rem minmax(0, 1fr);
  gap: .35rem;
}

.fix-list li::before {
  content: counter(fix, decimal-leading-zero);
  font-family: var(--font-mono);
  font-size: var(--chrome-small);
  color: var(--color-action);
  padding-top: 1px;
}

/* The source citation is the part that has to be readable: it is what the
   decision gets ported back into. */
.fix-list li .src {
  display: block;
  margin-top: .15rem;
  font-family: var(--font-mono);
  font-size: var(--chrome-small);
  color: var(--color-muted);
  overflow-wrap: anywhere;
}

.defect-list li::before { color: var(--color-warn); }

.decision-row { display: flex; gap: .4rem; flex-wrap: wrap; }

.dec {
  border: 1px solid var(--color-line-soft);
  background: var(--color-raised);
  border-radius: var(--seed-control-radius);
  padding: .4rem .8rem;
  font-size: var(--chrome-text);
  font-weight: 600;
  color: var(--color-muted);
  cursor: pointer;
}

.dec[aria-pressed="true"] { color: var(--color-ink); background: var(--color-action); border-color: transparent; }
.dec[data-dec="defer"][aria-pressed="true"] { background: var(--color-warn); }
.dec[data-dec="discuss"][aria-pressed="true"] { background: var(--color-muted); }

.dec-summary {
  display: grid;
  gap: .25rem;
  font-size: var(--chrome-text);
}

.dec-summary .line {
  display: flex;
  justify-content: space-between;
  gap: .5rem;
  font-family: var(--font-mono);
  font-size: var(--chrome-small);
  color: var(--color-muted);
}

.dec-summary .line b { color: var(--color-bright); font-weight: 600; }

.side .hint {
  margin: 0;
  font-size: var(--chrome-text);
  color: var(--color-muted);
  line-height: 1.55;
}

/* ============================================================================
   4. APP AS-IS GRAMMAR
   Class names and rules reproduce apps/app/src/client/workspace.css so the
   as-is renders are the shipped design, not an impression of it. Scoped under
   .scr so the board chrome is unaffected.
   ========================================================================== */
.scr { height: 100%; }
/* The frame element carries both classes, so the declared viewport height must win
   over the 100% above; without it percentage heights below collapse to auto. */
.screen.scr { height: var(--sh); }
.scr * { box-sizing: border-box; }

.scr .app-body {
  height: 100%;
  min-height: 100%;
  background: var(--color-ink);
  color: var(--color-bright);
  font-family: var(--font-ui);
  font-size: 14px;
  background-image: var(--horizon);
  background-repeat: no-repeat;
  display: flex;
  flex-direction: column;
}

.scr .kicker {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--color-muted);
}

.scr .kicker[data-tone="action"] { color: var(--color-action); }
.scr .kicker[data-tone="denied"], .scr .kicker[data-tone="error"] { color: var(--color-danger); }
.scr .kicker[data-tone="limit"], .scr .kicker[data-tone="stale"] { color: var(--color-warn); }
.scr .kicker[data-tone="offline"] { color: var(--color-muted); }

.scr .card-surface {
  background: var(--card-gradient);
  border: 1px solid var(--color-line-soft);
  border-radius: var(--seed-radius);
  box-shadow: var(--lift-shadow);
}

.scr .pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 9999px;
  padding: 1px 8px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .04em;
}

.scr .input {
  background: var(--color-raised);
  border: 1px solid var(--color-line);
  border-radius: var(--seed-control-radius);
  padding: .45rem .6rem;
  color: var(--color-bright);
}

.scr .input::placeholder { color: var(--color-muted); }

.scr .btn-key {
  background: linear-gradient(180deg, var(--color-action), var(--color-action-deep));
  color: var(--color-ink);
  border: none;
  border-radius: var(--seed-control-radius);
  padding: .45rem .9rem;
  font-weight: 600;
  cursor: pointer;
}

.scr .btn-key:disabled { opacity: .4; cursor: not-allowed; }

.scr .btn-ghost {
  background: color-mix(in srgb, var(--color-bright) 6%, transparent);
  color: var(--color-bright);
  border: 1px solid var(--color-line-soft);
  border-radius: var(--seed-control-radius);
  padding: .4rem .8rem;
  font-weight: 600;
  cursor: pointer;
}

.scr .btn-ghost:hover { border-color: var(--color-line); }

.scr .mono-id {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--color-muted);
  overflow-wrap: anywhere;
}

/* shell */
.scr .shell { display: flex; flex-direction: column; height: 100%; min-width: 0; }

.scr .topbar {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .55rem 1rem;
  border-bottom: 1px solid var(--color-line-soft);
  flex-wrap: wrap;
}

.scr .wordmark {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .22em;
  color: var(--color-bright);
  white-space: nowrap;
}

.scr .wordmark b { color: var(--color-action); font-weight: 600; }

.scr .project-select-wrap {
  display: flex;
  align-items: center;
  gap: .45rem;
  flex: 1 1 160px;
  min-width: 0;
  max-width: 380px;
}

.scr .project-select {
  flex: 1;
  min-width: 0;
  height: 2rem;
  padding: 0 .5rem;
  background: var(--color-raised);
  border: 1px solid var(--color-line);
  border-radius: var(--seed-control-radius);
}

.scr .topbar-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .4rem;
  row-gap: .35rem;
  margin-left: auto;
  justify-content: flex-end;
}

.scr .icon-btn {
  display: grid;
  place-items: center;
  width: 1.9rem;
  height: 1.9rem;
  border-radius: 999px;
  border: 1px solid var(--color-line-soft);
  background: transparent;
  color: var(--color-muted);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 11px;
}

.scr .icon-btn:hover { border-color: var(--color-action); color: var(--color-action); }

.scr .shell-body { display: flex; flex: 1; min-height: 0; }

.scr .aside {
  display: flex;
  flex-direction: column;
  width: 44%;
  min-width: 320px;
  max-width: 640px;
  border-right: 1px solid var(--color-line-soft);
  min-height: 0;
}

.scr .aside[data-collapsed="true"] { display: none; }

.scr .aside-tabs { display: flex; gap: .25rem; padding: .6rem 1rem 0; }

.scr .tab-btn {
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
  color: var(--color-muted);
  padding: .35rem .9rem;
  border-radius: var(--seed-control-radius) var(--seed-control-radius) 0 0;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.scr .tab-btn[aria-selected="true"] {
  background: var(--color-panel);
  border-color: var(--color-line-soft);
  color: var(--color-bright);
}

.scr .aside-scroll {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding: .8rem 1rem 1.2rem;
}

.scr .channel-pane {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  min-height: 0;
}

.scr .bottom-nav { display: none; }

/* state panels */
.scr .state-panel { padding: 1.1rem 1.2rem; }
.scr .state-title { margin: .4rem 0 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.scr .state-detail { margin: .35rem 0 0; color: var(--color-muted); font-size: 12.5px; line-height: 1.5; }
.scr .state-panel .btn-ghost { margin-top: .7rem; }

.scr .state-skeleton { display: grid; gap: .4rem; margin-top: .8rem; }
.scr .state-skeleton span {
  display: block;
  height: .85rem;
  border-radius: 6px;
  background: var(--color-lift);
  animation: pulse 1.4s ease-in-out infinite;
}
.scr .state-skeleton span:nth-child(2) { width: 70%; }
.scr .state-skeleton span:nth-child(3) { width: 45%; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
/* site.css 192-193 — the cursor on the lock line. Covered by the reduced-motion
   kill switch at the end of this stylesheet, as it is in the shipped page. */
@keyframes pb-bk { 50% { opacity: .2; } }
.scr .pb .blink { animation: pb-bk 1.1s steps(2, start) infinite; }

.scr .stale-chip {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-warn);
  border: 1px solid var(--tint-warn-edge);
  border-radius: 9999px;
  padding: 1px 8px;
}

/* brief / decision cards */
.scr .card-stack { display: grid; gap: .65rem; }
.scr .decision-card { position: relative; padding: .85rem 1rem; }
.scr .decision-card .card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}

.scr .kind-kicker {
  margin: 0;
  display: flex;
  align-items: center;
  gap: .4rem;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.scr .decision-card h3 { margin: .45rem 0 0; font-size: 15px; line-height: 1.35; letter-spacing: -.01em; }
.scr .decision-card .summary {
  margin: .3rem 0 0;
  color: var(--color-muted);
  font-size: 13px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.scr .status-pill[data-status="needs-you"] { background: var(--tint-action); color: var(--color-action); }
.scr .status-pill[data-status="changed"] { background: var(--tint-warn); color: var(--color-warn); }
.scr .status-pill[data-status="handled"] { background: var(--tint-ok); color: var(--color-ok); }
.scr .status-pill[data-status="blocked"] { background: var(--tint-danger); color: var(--color-danger); }

.scr .decision-card .actions {
  margin-top: .7rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .5rem;
}

.scr .detail-toggle {
  background: none;
  border: none;
  color: var(--color-muted);
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  cursor: pointer;
  padding: .15rem 0;
}

.scr .detail-toggle:hover { color: var(--color-action); }

.scr .card-details {
  margin-top: .5rem;
  border-top: 1px solid var(--color-line-soft);
  padding-top: .5rem;
  display: grid;
  gap: .3rem;
}

/* runs / artifacts */
.scr .inspector-section { margin-top: .9rem; }
.scr .inspector-section:first-child { margin-top: 0; }

.scr .section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: .5rem;
  padding: 0 .15rem .45rem;
}

.scr .section-head h3 { margin: 0; font-size: 14px; font-weight: 700; }
.scr .row-list { display: grid; gap: .45rem; }

.scr .inspector-row {
  padding: .6rem .8rem;
  border: 1px solid var(--color-line-soft);
  border-radius: var(--seed-radius);
  background: var(--color-panel);
  min-width: 0;
}

.scr .inspector-row .row-main {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: .6rem;
  min-width: 0;
}

.scr .inspector-row .row-title { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }

.scr .row-status {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-muted);
  white-space: nowrap;
}

.scr .row-status[data-status="cancelled"], .scr .row-status[data-status="failed"] { color: var(--color-danger); }
.scr .row-status[data-status="completed"] { color: var(--color-ok); }
.scr .row-status[data-status="running"] { color: var(--color-action); }

.scr .row-details {
  margin-top: .45rem;
  display: grid;
  gap: .2rem;
  border-top: 1px solid var(--color-line-soft);
  padding-top: .4rem;
}

/* channel */
.scr .transcript {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding: 1rem;
  display: grid;
  gap: .7rem;
  align-content: start;
}

.scr .msg { max-width: 78ch; min-width: 0; }

.scr .msg.user {
  justify-self: end;
  background: color-mix(in srgb, var(--color-action) 10%, transparent);
  border: 1px solid var(--tint-action-edge);
  border-radius: 12px;
  padding: .5rem .8rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.scr .msg.assistant { justify-self: start; width: 100%; max-width: 78ch; }
.scr .msg-meta { margin: 0 0 .2rem; }

.scr .tool-banner {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--color-muted);
  border: 1px solid var(--color-line-soft);
  border-left: 2px solid var(--color-action);
  border-radius: 6px;
  padding: .3rem .6rem;
  margin: .25rem 0;
  overflow-wrap: anywhere;
}

.scr .tool-banner[data-state="output-error"] { border-left-color: var(--color-danger); color: var(--color-danger); }
.scr .tool-banner[data-state="output-available"] { border-left-color: var(--color-ok); }

.scr .thinking-line { font-family: var(--font-mono); font-size: 11px; color: var(--color-muted); }

.scr .settlement-banner {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .06em;
  border: 1px solid var(--tint-danger-edge);
  border-radius: var(--seed-control-radius);
  color: var(--color-danger);
  padding: .35rem .7rem;
  margin: .25rem 0;
}

.scr .settlement-banner[data-outcome="completed"] {
  border-color: var(--tint-ok-edge);
  color: var(--color-ok);
}

.scr .draft-row {
  border: 1px dashed color-mix(in srgb, var(--color-warn) 55%, transparent);
  border-radius: var(--seed-radius);
  padding: .5rem .8rem;
  display: grid;
  gap: .3rem;
  justify-self: end;
  max-width: 78ch;
}

.scr .draft-row[data-state="cancelled"] { border-color: var(--color-line-soft); opacity: .65; }
.scr .draft-row .draft-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
.scr .draft-row[data-state="cancelled"] .draft-text { text-decoration: line-through; }
.scr .draft-actions { display: flex; gap: .4rem; align-items: center; }
.scr .draft-actions .btn-ghost { padding: .15rem .55rem; font-size: 11px; }

.scr .composer {
  border-top: 1px solid var(--color-line-soft);
  padding: .75rem 1rem;
  display: flex;
  gap: .5rem;
  align-items: flex-end;
  background: var(--color-panel);
}

.scr .composer textarea {
  flex: 1;
  min-width: 0;
  max-height: 8rem;
  min-height: 2.3rem;
  resize: none;
  background: var(--color-raised);
  border: 1px solid var(--color-line);
  border-radius: var(--seed-radius);
  padding: .5rem .7rem;
  color: var(--color-bright);
}

.scr .composer textarea:focus { border-color: var(--color-action); outline: none; }

/* forms + misc */
.scr .new-project-form {
  display: grid;
  gap: .45rem;
  padding: .8rem 1rem;
  border-bottom: 1px solid var(--color-line-soft);
  background: color-mix(in srgb, var(--color-action) 4%, transparent);
}

.scr .new-project-form .row { display: flex; gap: .45rem; min-width: 0; }
.scr .new-project-form input { flex: 1; min-width: 0; }
.scr .form-error { margin: 0; color: var(--color-danger); font-size: 12px; }
.scr .shell-loading { flex: 1; display: grid; place-items: center; padding: 1.5rem; min-width: 0; }
.scr .sign-in-card { max-width: 380px; width: 100%; padding: 1.4rem 1.5rem; }
.scr .sign-in-title { margin: .5rem 0 .75rem; font-size: 18px; letter-spacing: -.01em; }
/* Mirrors workspace.css .sign-in-btn (134-152) and .sign-in-error (154-157)
   exactly — including the fact that the error rule sets only a colour and a
   margin, so the alert prose and its nested retry button share one line. */
.scr .sign-in-btn {
  display: flex; align-items: center; justify-content: center; gap: .55rem;
  width: 100%; margin: .5rem 0 0; padding: .7rem 1rem; font-size: 1rem;
}
.scr .sign-in-btn:first-of-type { margin-top: .75rem; }
.scr .sign-in-err { margin: .75rem 0 0; color: var(--color-danger); font-size: 13px; line-height: 1.5; }
.scr .sign-in-err .btn-ghost { margin-left: .3rem; }
.scr .provider-mark { flex: none; display: block; }
/* sign-in redesign only: availability stated beside the control, not after the click */
.scr .si-lead { margin: 0 0 .9rem; font-size: 12.5px; line-height: 1.55; color: var(--color-muted); max-width: 42ch; }
.scr .si-provider { display: flex; align-items: center; gap: .55rem; margin-top: .5rem; flex-wrap: wrap; }
.scr .si-provider .r-btn { flex: 1 1 220px; min-width: 0; justify-content: flex-start; }
.scr .si-idle { margin: .9rem 0 0; font-size: 12px; line-height: 1.55; color: var(--color-muted); border-left: 2px solid var(--color-line); padding-left: .6rem; }

/* unwired screens: bare layout with no dedicated stylesheet (faithful) */
.scr .bare-pane { padding: 1rem 1.2rem; display: grid; gap: .7rem; }
.scr .bare-pane h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.scr .bare-pane h3 { margin: .3rem 0 0; font-size: 14px; }
.scr .bare-pane p { margin: 0; font-size: 13px; color: var(--color-muted); line-height: 1.55; }
.scr .bare-pane ul { margin: 0; padding-left: 1.1rem; font-size: 13px; line-height: 1.6; }
.scr .bare-list { display: grid; gap: .6rem; }

/* Routed surfaces that bring their own visual system: discovery/Results.tsx,
   judge/Scorecard.tsx, submission/Package.tsx, evidence/Drawer.tsx. They set
   maxWidth and fontFamily inline and nothing else, so the reproduction keeps
   only those two properties here and lets every other value come from the same
   inline attributes the component writes. The canvas stays the product's own
   --color-ink (#090b10, tokens.css:14) and the inherited 14px body size —
   that is exactly why the hex greys land at ~2.7:1 instead of on a white card. */
.scr .asis-island { max-width: 760px; width: 100%; font-family: var(--asis-system-stack); }
.scr .asis-island h2 { margin: 0; font-size: 1.1rem; }
.scr .asis-island h3 { margin: .75rem 0 .25rem; font-size: 1rem; }
.scr .asis-island ul { list-style: none; margin: 0; padding: 0; }
.scr .asis-island button,
.scr .asis-island input,
.scr .asis-island textarea { font-family: var(--asis-system-stack); font-size: 13.33px; }
.scr .asis-island a { color: var(--color-action); }
.scr .isi-head { display: flex; justify-content: space-between; align-items: baseline; }
.scr .isi-row { display: flex; gap: 8px; align-items: baseline; }
/* The badge chips in Results.tsx 209-223, Scorecard.tsx 223 and Package.tsx 283/337 set
   a background hex and never a colour, so they inherit body's --color-bright. Reproduced
   here without a colour on purpose: that inheritance is the defect (1.01-1.09:1). */
.scr .isi-chip { border-radius: 4px; padding: 0 .35rem; font-size: .8rem; }
.scr .isi-box { border-radius: 6px; padding: .5rem .75rem; margin: .5rem 0; }

/* Board annotation drawn inside the frame. Deliberately not product-looking —
   monospace, dashed, prefixed with AS-IS — so a reviewer never mistakes it for
   copy that ships, and the citation travels with the screenshot instead of
   being buried in the caption below the stage. */
.scr .asis-note {
  margin: 1rem auto 0; max-width: 760px; padding: .55rem .7rem;
  border: 1px dashed var(--color-line); border-radius: 4px;
  font-family: var(--font-mono); font-size: 11px; line-height: 1.65;
  color: var(--color-muted);
}
.scr .asis-note em { font-style: normal; color: var(--color-action); }

/* repository picker — DELIBERATELY HAS NO STYLES.
   RepositoryPicker.tsx renders repository-picker__* class names that are not
   defined in workspace.css or tokens.css, so the shipped screen falls back to
   the browser defaults. Nothing below is an accident. */

/* USER-AGENT ISLAND.
   `all: revert` rolls one subtree back to the browser's own rendering, which is the
   condition the P07 components live in: their only mounting page loads no stylesheet
   (tests/browser/artifacts.spec.ts 54-60, contrast settings.spec.ts 56, 269). The
   mirrored product rules further down this stylesheet do not reach inside it. */
.scr .asis-naive, .scr .asis-naive * { all: revert; }
.scr .asis-naive {
  background: var(--asis-inline-surface); color: var(--asis-inline-ink); max-width: 780px; width: 100%;
  padding: 1rem 1.1rem; border: 1px solid var(--color-line); border-radius: 4px;
}

/* As-is pages for the orphan surfaces: two renderings of the same markup, each
   labelled, because the review has to see both the class discipline and the fact
   that nothing in the product applies it. */
.scr .asis-page { flex: 1; min-height: 0; overflow-y: auto; padding: 1.1rem 1.4rem 2rem; display: grid; gap: .6rem; align-content: start; }
.scr .asis-label {
  margin: .5rem 0 0; font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: .06em; text-transform: uppercase; color: var(--color-muted);
}
.scr .asis-mounted {
  max-width: 880px; width: 100%; padding: 1rem 1.1rem;
  border: 1px solid var(--color-line-soft); border-radius: 12px; background: var(--color-panel);
}
.scr .asis-note + .asis-label, .scr .asis-mounted + .asis-label { margin-top: .9rem; }

/* The default white page, WITHOUT `all: revert`. The P10 drawer's styling lives in its
   inline attributes, so reverting a subtree would delete the component instead of the
   stylesheet; here only the page changes — light surface, UA ink, inline styles intact.
   That pairing is the evidence for defect 2: the same markup measures 7.30:1 below and
   2.70:1 above. */
.scr .asis-uapage {
  background: var(--asis-inline-surface); color: var(--asis-inline-ink);
  max-width: 780px; width: 100%; padding: 1rem 1.1rem;
  border: 1px solid var(--color-line); border-radius: 4px;
}

/* Two renderings of one component, side by side: the comparison this board keeps
   having to make — the markup as written, and the page it was written for — reads
   better next to each other than stacked a screen-height apart. */
.scr .asis-pair {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
  gap: .9rem;
  align-items: start;
}
/* The two islands are taller than the stage, and the annotation under them is the part
   a reviewer reads second. Cap the pair so both renderings and the note are reachable
   without losing the side-by-side. */
.scr .asis-pair { max-height: 590px; overflow-y: auto; overscroll-behavior: contain; }
.scr .asis-pair > div { min-width: 0; }
.scr .asis-pair .asis-uapage { max-width: none; }

/* Standalone state chip. `.r-state` had a rule only inside `.r-card`, so the same class
   used outside a card rendered as unstyled text at a size the board wrote inline — 10px,
   under its own legibility floor. Tone variants mirror the product's status vocabulary. */
.scr .r-state {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  border-radius: 9999px;
  padding: 2px 9px;
  border: 1px solid var(--color-line-soft);
  color: var(--color-muted);
}

.scr .r-state[data-tone="ok"] { color: var(--color-ok); border-color: var(--tint-ok-edge); background: var(--tint-ok); }
.scr .r-state[data-tone="warn"] { color: var(--color-warn); border-color: var(--tint-warn-edge); background: var(--tint-warn); }
.scr .r-state[data-tone="danger"] { color: var(--color-danger); border-color: var(--tint-danger-edge); background: var(--tint-danger); }
.scr .r-state[data-tone="action"] { color: var(--color-action); border-color: var(--tint-action-edge); background: var(--tint-action); }

/* copy affordance for content-addressed bytes: a hash you cannot copy cannot be
   verified, which is the whole claim of the artifact and approval surfaces */
.scr .r-copy {
  display: inline-flex; align-items: center; margin-left: .4rem; padding: .1rem .2rem;
  background: none; border: 0; color: var(--color-muted); cursor: pointer; vertical-align: middle;
}
.scr .r-copy:hover { color: var(--color-action); }
/* permission chips: the required pair is marked, because the shipped component only
   names them after a bind has already failed */
.scr .r-perm {
  display: inline-block; margin: 0 .25rem .25rem 0; padding: .1rem .4rem;
  font-family: var(--font-mono); font-size: 11px; border-radius: 4px;
  border: 1px solid var(--color-line-soft); color: var(--color-muted);
}
.scr .r-perm-req { border-color: var(--tint-action-edge, var(--color-line)); color: var(--color-action); }
.scr .r-perm-none { border-style: dashed; }
.scr .r-subnav button .sz { color: var(--color-muted); font-family: var(--font-mono); font-size: var(--r-label); margin-left: .35rem; }

/* ============================================================================
   5. REDESIGNED GRAMMAR
   Same palette roles, same fonts, same radius scale. What changes: token
   discipline, shared chrome, information hierarchy, real navigation.
   ========================================================================== */
.scr .app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

/* the body pane is always the last child: it takes what the chrome leaves */
.scr .app-shell > :last-child { flex: 1 1 auto; min-height: 0; }

.scr .app-nav {

  align-items: center;
  gap: .2rem;

}

.scr .app-nav a {
  display: inline-flex;
  align-items: center;
  gap: .35rem;

.scr .r-section-head .count {

/* priority-ranked decision cards */
.scr .r-stack { display: grid; gap: .55rem; }

.scr .r-card {

.scr .r-card[data-status="needs-you"]::before { background: var(--color-action); }

.scr .r-card[data-status="handled"]::before { background: var(--color-ok); }

.scr .r-card .r-head {

.scr .r-card .r-kind {

/* Decision-card state chips need no separate declaration any more: the standalone

   card-specific, because it keys off the card's own data-status. */

.scr .r-card[data-status="needs-you"] .r-state { color: var(--color-action); border-color: var(--tint-action-edge); background: var(--tint-action); }
.scr .r-card[data-status="changed"] .r-state { color: var(--color-warn); border-color: var(--tint-warn-edge); background: var(--tint-warn); }

.scr .r-card h3 { margin: .4rem 0 0; font-size: 15px; line-height: 1.35; letter-spacing: -.01em; }
.scr .r-card .r-sum { margin: .25rem 0 0; font-size: 12.5px; line-height: 1.55; color: var(--color-muted); max-width: 65ch; }

.scr .r-card .r-meta {
  margin: .5rem 0 0;
  display: flex;
  gap: .8rem;

}

.scr .r-card .r-acts { margin-top: .65rem; display: flex; gap: .45rem; align-items: center; flex-wrap: wrap; }

.scr .r-card .r-authorises {
  margin: .55rem 0 0;
  padding-top: .5rem;
  border-top: 1px dashed var(--color-line-soft);

}

.scr .r-btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;

}

.scr .r-btn[data-tone="primary"]:hover { background: var(--color-action-deep); }

.scr .r-btn[data-tone="danger"] { color: var(--color-danger); border-color: var(--tint-danger-edge); background: var(--tint-danger); }
.scr .r-btn[disabled] { opacity: .45; cursor: not-allowed; }

.scr .r-link {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  font-family: var(--font-mono);
  font-size: var(--r-meta);
  letter-spacing: .04em;
  color: var(--color-muted);

  border-bottom: 1px solid var(--color-line-soft);

}

.scr .r-link:hover { color: var(--color-action); border-bottom-color: var(--tint-action-edge); }

/* runs timeline */
.scr .r-run {

  grid-template-columns: 1.4rem minmax(0, 1fr);

.scr .r-turn { display: grid; gap: .35rem; max-width: 74ch; }

.scr .r-draft {
