.scr table.r-table td.mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--color-muted); }

.scr .r-dot {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font-family: var(--font-mono);
  font-size: var(--r-meta);
  letter-spacing: .04em;
  white-space: nowrap;
}

.scr .r-dot i {
  width: 7px;
  height: 7px;
  border-radius: 9999px;
  background: var(--color-muted);
  flex: 0 0 7px;
}

.scr .r-dot[data-tone="ok"] { color: var(--color-ok); }
.scr .r-dot[data-tone="ok"] i { background: var(--color-ok); }
.scr .r-dot[data-tone="warn"] { color: var(--color-warn); }
.scr .r-dot[data-tone="warn"] i { background: var(--color-warn); }
.scr .r-dot[data-tone="danger"] { color: var(--color-danger); }
.scr .r-dot[data-tone="danger"] i { background: var(--color-danger); }
.scr .r-dot[data-tone="action"] { color: var(--color-action); }
.scr .r-dot[data-tone="action"] i { background: var(--color-action); }

/* Board proposal, not shipped: a roadmap state that cannot be mistaken for a
   failure. Planned rows currently borrow data-status="blocked", the danger
   tint (workspace.css 515-518), so "not built yet" and "broken" share a colour. */
.scr .r-dot[data-tone="roadmap"] { color: var(--color-muted); }
.scr .r-dot[data-tone="roadmap"] i {
  background: transparent;
  border: 1px dashed var(--color-muted);
  width: 7px;
  height: 7px;
}

/* evidence provenance */
.scr .r-ev-head {
  padding: .8rem .9rem;
  border-bottom: 1px solid var(--color-line-soft);
  display: grid;
  gap: .35rem;
  background: color-mix(in srgb, var(--color-action) 4%, transparent);
}

.scr .r-ev-head h3 { margin: 0; font-size: 14px; font-weight: 600; }

.scr .r-ev-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: .5rem .9rem;
}

.scr .r-field .fk {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--r-label);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--color-muted);
  margin-bottom: .15rem;
}

.scr .r-field .fv { font-size: 12.5px; line-height: 1.5; }
.scr .r-field .fv.mono { font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere; }

.scr .r-claim {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: .5rem;
  padding: .6rem .9rem;
  border-bottom: 1px solid var(--color-hairline);
}

.scr .r-claim .cl-text { font-size: 13px; line-height: 1.5; }
.scr .r-claim .cl-src { margin-top: .25rem; font-family: var(--font-mono); font-size: var(--r-meta); color: var(--color-muted); }

/* Stack interests as real controls: shipped wraps the checkbox in `.pill`, which is
   the read-only status vocabulary at 10.5px with no checked state (Settings.tsx 224).
   The redesign needs a toggle that says which way it is set from across the frame. */
.scr .r-check {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .3rem .55rem;
  border: 1px solid var(--color-line);
  border-radius: var(--seed-control-radius);
  background: var(--color-raised);
  font-family: var(--font-mono);
  font-size: 11.5px;
  cursor: pointer;
}

.scr .r-check input { accent-color: var(--color-action); margin: 0; }

.scr .r-check:has(input:checked) {
  border-color: var(--tint-action-edge);
  background: color-mix(in srgb, var(--color-action) 11%, transparent);
}

/* Evidence class as prose, not a chip: the board's own .status-chip is uppercase
   chrome scale and would shout inside a reproduced table row. */
.scr .r-ev {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--r-meta);
  line-height: 1.45;
  color: var(--color-muted);
}

.scr .r-ev[data-evidence="LOCAL VERIFIED"] { color: var(--color-action); }
.scr .r-ev[data-evidence="BLOCKED"] { color: var(--color-danger); }

.scr .r-conflict {
  margin: 0 .9rem .7rem;
  padding: .55rem .7rem;
  border: 1px solid var(--tint-warn-edge);
  border-radius: var(--seed-control-radius);
  background: var(--tint-warn);
  font-size: 12px;
  line-height: 1.5;
}

.scr .r-conflict b { font-weight: 600; }

/* artifact viewer + diff */
.scr .r-diff {
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.scr .r-diff .ln { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: .5rem; padding: 0 .2rem; }
.scr .r-diff .ln .no { color: var(--color-muted); text-align: right; }
.scr .r-diff .add { background: var(--tint-ok); }
.scr .r-diff .del { background: var(--tint-danger); }

/* overview report */
.report { padding: 1.2rem 1.4rem 2rem; display: grid; gap: 1.1rem; }
.report h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
.report .lede { margin: 0; font-size: 13px; color: var(--color-muted); max-width: 74ch; line-height: 1.6; }

.dim-grid { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 1.1rem; align-items: start; }

.dim {
  border: 1px solid var(--color-line-soft);
  border-radius: var(--seed-radius);
  background: var(--card-gradient);
  padding: .8rem .9rem;
  display: grid;
  gap: .3rem;
}

.dim + .dim { margin-top: .55rem; }

.dim .dim-head { display: flex; align-items: baseline; gap: .5rem; }
.dim h3 { margin: 0; font-size: 13.5px; font-weight: 600; }

.dim .band {
  font-family: var(--font-mono);
  font-size: var(--r-meta);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-muted);
}

.dim .score {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.dim .score[data-band="Broken"] { color: var(--color-danger); }
.dim .score[data-band="Functional"] { color: var(--color-warn); }
.dim .score[data-band="Strong"] { color: var(--color-action); }
.dim .score[data-band="Exceptional"] { color: var(--color-ok); }

.dim .ev { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--color-muted); }
.dim .ev code { font-family: var(--font-mono); font-size: 11.5px; color: var(--color-bright); }

.radar {
  border: 1px solid var(--color-line-soft);
  border-radius: var(--seed-radius);
  background: var(--card-gradient);
  padding: .8rem;
  display: grid;
  gap: .5rem;
  justify-items: center;
}

.radar svg { width: 100%; height: auto; }
.radar .radar-label { font-family: var(--font-mono); font-size: var(--r-label); letter-spacing: .1em; text-transform: uppercase; color: var(--color-muted); }

.action-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: .8rem; }

.action-col {
  border: 1px solid var(--color-line-soft);
  border-radius: var(--seed-radius);
  padding: .8rem .9rem;
  display: grid;
  gap: .45rem;
  background: var(--card-gradient);
}

.action-col h4 {
  margin: 0 0 .2rem;
  font-family: var(--font-mono);
  font-size: var(--r-label);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--color-muted);
}

.action-col ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .4rem; }

.action-col li {
  display: grid;
  grid-template-columns: 1rem minmax(0, 1fr);
  gap: .35rem;
  font-size: 12.5px;
  line-height: 1.55;
}

.action-col li svg { margin-top: 3px; color: var(--color-muted); }
.action-col[data-kind="fix"] li svg { color: var(--color-danger); }
.action-col[data-kind="keep"] li svg { color: var(--color-ok); }
.action-col[data-kind="quick"] li svg { color: var(--color-warn); }

/* landing */
.scr .pb {
  /* Aliases copied from apps/site/src/styles/site.css 14-36 so the as-is
     fragments can carry their shipped inline style attributes verbatim. */
  --pb-fg: var(--color-bright);
  --pb-bg: var(--color-ink);
  --pb-surface: var(--color-panel);
  --pb-raised: var(--color-raised);
  --pb-primary: var(--color-action);
  --pb-ok: var(--color-ok);
  --pb-warn: var(--color-warn);
  --pb-danger: var(--color-danger);
  --pb-on-key: var(--color-ink);
  --pb-muted: var(--color-muted);
  --pb-quiet: color-mix(in srgb, var(--color-muted) 88%, transparent);
  --pb-line: var(--color-line);
  --pb-line-soft: var(--color-line-soft);
  --pb-line-hard: color-mix(in srgb, var(--color-bright) 28%, transparent);
  --pb-tint-primary: color-mix(in srgb, var(--color-action) 11%, transparent);
  --pb-tint-ok: color-mix(in srgb, var(--color-ok) 9%, transparent);
  --pb-tint-warn: color-mix(in srgb, var(--color-warn) 9%, transparent);
  --pb-tint-danger: color-mix(in srgb, var(--color-danger) 9%, transparent);
  --pb-panel: color-mix(in srgb, var(--color-raised) 78%, var(--color-ink));
  --pb-gutter: 24px;
  --pb-rail: 1px solid var(--pb-line-soft);
  font-family: var(--font-ui);
}

/* As-is landing is dark-only, and that is a code fact rather than a mood:
   site.css line 10 imports the dual-theme token file, but apps/site never sets
   data-theme on <html> and site.css contains no prefers-color-scheme rule (only
   two reduced-motion blocks), so every --pb-* alias resolves to the :root dark
   set. The replica pins the same palette at .pb scope, so switching the board to
   Light demonstrates the gap instead of papering over it. */
.scr .pb[data-pb-theme="locked"] {
  --color-ink: var(--seed-ref-dark-bg);
  --color-panel: var(--seed-ref-dark-surface);
  --color-raised: var(--seed-ref-dark-raised);
  --color-lift: var(--seed-ref-dark-lift);
  --color-bright: var(--seed-ref-dark-fg);
  --color-muted: var(--seed-ref-dark-muted);
  --color-action: var(--seed-ref-dark-primary);
  --color-action-deep: var(--seed-ref-dark-primary-deep);
  --color-ok: var(--seed-ref-dark-ok);
  --color-warn: var(--seed-ref-dark-accent);
  --color-danger: var(--seed-ref-dark-danger);
  --color-line: color-mix(in srgb, var(--seed-ref-dark-fg) 13%, transparent);
  --color-line-soft: color-mix(in srgb, var(--seed-ref-dark-fg) 7%, transparent);
  --color-line-strong: color-mix(in srgb, var(--seed-ref-dark-fg) 22%, transparent);
  --color-hairline: color-mix(in srgb, var(--seed-ref-dark-fg) 5%, transparent);
  --card-gradient: linear-gradient(180deg,
      color-mix(in srgb, var(--seed-ref-dark-raised) 70%, var(--seed-ref-dark-surface)),
      var(--seed-ref-dark-surface));
  --horizon: radial-gradient(1200px 500px at 50% -10%,
      color-mix(in srgb, var(--seed-ref-dark-primary) 13%, transparent), transparent 60%);
}

.scr .pb .l-top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 1.25rem;
  padding: 0 var(--pb-gutter); min-height: 56px;
  background: color-mix(in srgb, var(--pb-bg) 97%, var(--pb-fg));
  border-bottom: var(--pb-rail);
}

.scr .pb .l-mark { font-family: var(--font-mono); font-size: .8125rem; letter-spacing: .24em; text-transform: uppercase; font-weight: 700; }
.scr .pb .l-nav { display: flex; gap: 1.25rem; margin-left: .5rem; }
.scr .pb .l-nav a {
  font-family: var(--font-mono);
  font-size: .6875rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--pb-quiet);
  text-decoration: none;
  padding-block: .375rem;
  border-bottom: 1px solid transparent;
}
.scr .pb .l-nav a:hover { color: var(--pb-fg); border-bottom-color: var(--pb-line-hard); }
.scr .pb .l-cta { margin-left: auto; display: flex; gap: .75rem; align-items: center; }
/* site.css 46-47 — the skip link is offscreen until focused. */
.scr .pb .l-skip { position: absolute; left: -9999px; }
.scr .pb .l-skip:focus { left: 16px; top: 16px; z-index: 99; background: var(--pb-primary); color: var(--pb-bg); padding: 10px 16px; }
/* Landing's own control rules, ported from site.css 71-77 so the divergence is
   visible on the board: `.btn-key` on the landing is the WARN fill at 6px radius
   and 550 weight, while the app's `.btn-key` (workspace.css 104-112) is the
   action gradient at 8px and 600. Same class name, two different primaries. */
.scr .pb .l-btn {
  display: inline-flex; align-items: center; gap: .5rem;
  font-family: var(--font-ui); font-size: 13px; font-weight: 550; letter-spacing: .01em;
  padding: .56rem .94rem; border: 1px solid transparent; border-radius: 6px;
  cursor: pointer; white-space: nowrap; text-decoration: none;
}
.scr .pb .l-btn-key { background: var(--pb-warn); color: var(--pb-on-key); }
.scr .pb .l-btn-key:hover { background: color-mix(in srgb, var(--pb-warn) 86%, var(--pb-on-key)); }
.scr .pb .l-btn-line { background: transparent; border-color: var(--pb-line-hard); color: var(--pb-fg); }
.scr .pb .l-btn-line:hover { background: color-mix(in srgb, var(--pb-fg) 7%, transparent); }
.scr .pb .l-link-quiet { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--pb-muted); background: none; border: none; cursor: pointer; padding: 0; }
.scr .pb .l-link-quiet:hover { color: var(--pb-fg); }

/* site.css 40-48 + 126-139 — the shipped hero is a two-column split with a
   labelled illustrative device composition on the right, and the run spine is a
   sticky 176px rail of numbered links beside the acts. Ported rather than
   paraphrased so the replica can carry the real hero art. */
.scr .pb .l-hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); border-bottom: var(--pb-rail); }
.scr .pb .l-hero-l { padding: clamp(2rem, 4cqw, 4.5rem) var(--pb-gutter) clamp(1.75rem, 3.5cqw, 4rem); border-right: var(--pb-rail); display: flex; flex-direction: column; justify-content: center; }
.scr .pb .l-hero-r { padding: clamp(2rem, 4cqw, 4.5rem) var(--pb-gutter) clamp(1.75rem, 3.5cqw, 4rem); }
.scr .pb .l-hero .eyebrow { display: flex; align-items: center; gap: .75rem; margin: 0 0 1.5rem; }
.scr .pb .l-hero .eyebrow .rule { flex: 1; height: 1px; background: var(--pb-line-soft); }
.scr .pb .l-hero h1 { font-size: clamp(2.75rem, 6.2cqw, 5.5rem); line-height: 1.05; letter-spacing: -.035em; font-weight: 600; margin: 0; }
.scr .pb .l-hero .l-lede { margin-top: 1.5rem; }
.scr .pb .hero-cta { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-top: 2rem; }
.scr .pb .shot { border: 1px solid var(--pb-line); background: var(--pb-panel); }
.scr .pb .shot .bar { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem; border-bottom: var(--pb-rail); }
.scr .pb .shot .bar span { font-family: var(--font-mono); font-size: .5625rem; letter-spacing: .1em; text-transform: uppercase; color: var(--pb-quiet); }
.scr .pb .shot .bar i { width: 8px; height: 8px; border-radius: 50%; background: var(--pb-line-hard); }
.scr .pb .shot .bar i:first-child { background: color-mix(in srgb, var(--pb-danger) 70%, transparent); }
.scr .pb .shot .bar i:nth-child(2) { background: color-mix(in srgb, var(--pb-warn) 70%, transparent); }
.scr .pb .shot .bar i:nth-child(3) { background: color-mix(in srgb, var(--pb-ok) 65%, transparent); }
.scr .pb .shot .bar span.host { margin-left: .5rem; }
.scr .pb .shot-body { padding: .875rem; display: grid; gap: .625rem; }
.scr .pb .devices { position: relative; }
.scr .pb .mobile-shot { position: relative; z-index: 1; width: min(250px, 72%); margin: -6rem 0 0 auto; border: 1px solid var(--pb-line-hard); border-radius: 12px; overflow: hidden; background: var(--pb-panel); box-shadow: 0 22px 44px -24px rgba(0, 0, 0, .5); }
.scr .pb .mobile-shot .shot-body { padding: .75rem; }
.scr .pb .devices-cap { margin-top: 1.125rem; font-size: .75rem; line-height: 1.6; color: var(--pb-quiet); max-width: 56ch; }

.scr .pb .l-spine-wrap { border-bottom: var(--pb-rail); }
.scr .pb .l-spine-head { padding: clamp(2rem, 4cqw, 5.5rem) var(--pb-gutter) 0; }
.scr .pb .l-spine-head h2 { margin: 1rem 0 0; max-width: 26ch; font-size: clamp(1.625rem, 2.6cqw, 2.25rem); line-height: 1.08; letter-spacing: -.026em; font-weight: 600; }
.scr .pb .l-spine-head .l-lede { margin-top: 1.25rem; }
.scr .pb .l-spine { display: grid; grid-template-columns: 176px minmax(0, 1fr); align-items: start; }
.scr .pb .l-spine-rail { position: sticky; top: 56px; display: grid; gap: .375rem; padding: 2.25rem 1.25rem; border-right: var(--pb-rail); align-self: start; }
.scr .pb .rail-title { margin: 0 0 .25rem; }
.scr .pb .rail-link { display: flex; gap: .5rem; align-items: baseline; padding: .25rem 0; font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pb-quiet); }
.scr .pb .rail-link span:first-child { color: var(--pb-primary); }
.scr .pb .rail-link[aria-current="true"] { color: var(--pb-fg); }
.scr .pb .l-acts { display: grid; }
.scr .pb .l-act { border-bottom: var(--pb-rail); padding: clamp(1.75rem, 3cqw, 3.5rem) var(--pb-gutter); display: grid; gap: 1rem; }
.scr .pb .l-act:last-child { border-bottom: 0; }
.scr .pb .l-act .act-step { margin: 0; display: flex; align-items: baseline; gap: .625rem; font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: var(--pb-quiet); }
.scr .pb .l-act .act-step b { color: var(--color-warn); font-weight: 700; }
.scr .pb .l-act h3 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -.024em; line-height: 1.1; }
.scr .pb .l-act .l-lede { margin-top: .75rem; max-width: 62ch; }
.scr .pb .act-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
.scr .pb .figures + .figures, .scr .pb .l-act .figures { margin-top: .5rem; }

.scr .l-band { padding: clamp(2.5rem, 6cqw, 5.5rem) var(--pb-gutter); border-bottom: var(--pb-rail); }
.scr .pb .l-band-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3rem; align-items: end; margin-bottom: 3rem; }
.scr .pb .l-band-head .lbl { margin-bottom: 1rem; }
.scr .pb .l-band-head h2 { margin: 0; }
.scr .l-band h2 { margin: 0 0 .9rem; font-size: clamp(1.625rem, 2.6cqw, 2.25rem); line-height: 1.08; letter-spacing: -.026em; font-weight: 600; }

/* site.css 154-163 — honesty grid, the "what Caddie will not do" band and the
   lock line. Replaces the earlier pill treatment, which was the board's own. */
.scr .pb .honest { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: var(--pb-rail); border-left: 0; }
.scr .pb .honest > div { padding: 1.75rem 1.5rem; border-left: var(--pb-rail); }
.scr .pb .honest h3 { font-size: 1rem; font-weight: 600; letter-spacing: -.012em; margin: .75rem 0 0; line-height: 1.3; }
.scr .pb .honest p { color: var(--pb-muted); font-size: .8125rem; line-height: 1.6; margin: .5rem 0 0; }
.scr .pb .locked { margin-top: 2.5rem; padding: 1.5rem var(--pb-gutter); border-top: var(--pb-rail); display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 3rem; align-items: start; }
.scr .pb .locked h3 { font-size: 1.125rem; font-weight: 600; letter-spacing: -.015em; margin: .75rem 0 0; }
.scr .pb .locked ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.scr .pb .locked li { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); gap: .75rem; font-size: .875rem; color: var(--pb-muted); line-height: 1.55; }
.scr .pb .locked li i { font-family: var(--font-mono); font-style: normal; font-size: .625rem; color: var(--pb-danger); }
.scr .pb .lockline { grid-column: 1 / -1; margin: 0; padding-top: 1.25rem; border-top: var(--pb-rail); font-family: var(--font-mono); font-size: .75rem; letter-spacing: .06em; color: var(--pb-fg); }

/* shipped closing band + footer — site.css 172-175 (.close) and 178-184
   (.foot / .foot-mark / .foot-grid / .foot-links). */
.scr .pb .l-close { border-bottom: var(--pb-rail); display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); background: color-mix(in srgb, var(--pb-primary) 5%, transparent); }
.scr .pb .l-close-l { padding: 5rem var(--pb-gutter); border-right: var(--pb-rail); }
.scr .pb .l-close-r { padding: 5rem var(--pb-gutter); }
.scr .pb .l-close .frag { max-width: 26rem; }
.scr .pb .l-close h2 { margin: 1.25rem 0 0; max-width: 18ch; }
.scr .pb .l-close .l-lede { margin: 1.25rem 0 0; }
.scr .pb .l-foot { padding: 3rem var(--pb-gutter) 2rem; }
.scr .pb .l-foot-mark { margin: 0; font-family: var(--font-mono); font-weight: 700; letter-spacing: .14em; font-size: clamp(2.5rem, 9cqw, 7rem); line-height: .9; color: color-mix(in srgb, var(--pb-fg) 12%, transparent); text-transform: uppercase; }
.scr .pb .l-foot-grid { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: space-between; align-items: flex-start; margin-top: 1.5rem; padding-top: 1.25rem; border-top: var(--pb-rail); }
.scr .pb .l-foot-grid p { font-size: .75rem; color: var(--pb-quiet); max-width: 52ch; margin: 0; }
.scr .pb .l-foot-links { display: flex; gap: 1.25rem; }
.scr .pb .l-foot-links a { font-family: var(--font-mono); font-size: .625rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pb-quiet); }
.scr .mono-id.note-id { display: block; margin-top: .8rem; }
/* site.css 187-188 — the fixed mobile bar, hidden above 767px. */
.scr .pb .l-mbar { position: absolute; inset-inline: 0; bottom: 0; display: none; align-items: center; gap: .75rem; padding: .5rem .75rem; background: color-mix(in srgb, var(--pb-bg) 96%, var(--pb-fg)); border-top: var(--pb-rail); z-index: 40; }
.scr .pb .l-mbar span { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: .625rem; letter-spacing: .1em; text-transform: uppercase; color: var(--pb-quiet); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scr--mobile .pb .l-mbar { display: flex; }
/* site.css .pb .foot-mark asks IBM Plex Mono at 700 — one of the six rules whose
   weight is not installed, so this line renders as synthesised bold. Kept on the
   replica deliberately. */

/* the card demo */
.scr .the-card {
  max-width: 420px;
  padding: 1rem;
  display: grid;
  gap: .6rem;
}

.scr .the-card .tc-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.scr .the-card h3 { margin: 0; font-size: 15px; line-height: 1.35; letter-spacing: -.01em; }

.scr .tc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .4rem .8rem; }

/* shipped demo fragments — site.css 51-52 (.mono/.lbl), 108-124 (.frag /
   .frag-k / .pill / .mrow / .nested / .note / .chips / .fresh / .cta-tag) and
   166-168 (.stackgrid / .bagnote), so the landing bands show the real card
   grammar rather than a paraphrase. */
.scr .pb .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: .08em; text-transform: uppercase; }
.scr .pb .lbl { font-size: .6875rem; color: var(--pb-quiet); font-weight: 500; }
.scr .pb .demo-banner { display: inline-flex; align-items: center; gap: .625rem; margin-bottom: 1.75rem; border: 1px solid color-mix(in srgb, var(--pb-warn) 45%, transparent); background: var(--pb-tint-warn); color: var(--pb-warn); border-radius: 6px; padding: .5rem .75rem; font-family: var(--font-mono); font-size: .625rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.scr .pb .stackgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--pb-line-soft); border: var(--pb-rail); }
.scr .pb .stackgrid .frag { border: 0; border-radius: 0; background: var(--pb-bg); }
.scr .pb .stackgrid .span2 { grid-column: span 2; }
.scr .pb .frag { background: var(--pb-panel); border: 1px solid var(--pb-line-soft); border-radius: 6px; padding: .8125rem .875rem .875rem; }
.scr .pb .frag-k { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: 0; font-family: var(--font-mono); font-size: .6875rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.scr .pb .frag-k svg { width: 12px; height: 12px; stroke-width: 2.2; vertical-align: -1px; margin-right: .3125rem; fill: none; stroke: currentColor; }
.scr .pb .pill { display: inline-flex; border-radius: 9999px; padding: .0625rem .4375rem; font-family: var(--font-mono); font-size: .65625rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: color-mix(in srgb, var(--pb-fg) 9%, transparent); color: var(--pb-muted); }
.scr .pb .frag h4 { margin: .4375rem 0 0; font-size: .875rem; font-weight: 600; letter-spacing: -.008em; line-height: 1.35; }
.scr .pb .mrow { display: flex; gap: .375rem; margin: 0; font-size: .6875rem; line-height: 1.55; }
.scr .pb .mrow .k { color: var(--pb-muted); }
.scr .pb .mrow .ar { font-family: var(--font-mono); font-size: .5625rem; }
.scr .pb .mrow .v { color: var(--pb-fg); }
.scr .pb .nested { border-radius: 6px; padding: .5rem .625rem; margin-top: .5rem; display: grid; gap: .25rem; }
.scr .pb .big { font-family: var(--font-mono); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.scr .pb .note { margin-top: .5rem; font-size: .75rem; line-height: 1.55; color: color-mix(in srgb, var(--pb-fg) 88%, var(--pb-bg)); }
.scr .pb .note .mk { font-family: var(--font-mono); font-size: .5625rem; margin-right: .3125rem; }
.scr .pb .chips { display: flex; flex-wrap: wrap; gap: .3125rem; margin-top: .5rem; }
.scr .pb .chip { border: 1px solid var(--pb-line-soft); background: color-mix(in srgb, var(--pb-raised) 60%, var(--pb-bg)); border-radius: 9999px; padding: .0625rem .4375rem; font-family: var(--font-mono); font-size: .5625rem; color: var(--pb-muted); }
.scr .pb .chip b { color: var(--pb-ok); font-weight: 700; }
.scr .pb .fresh { font-family: var(--font-mono); font-size: .625rem; letter-spacing: .08em; text-transform: uppercase; color: var(--pb-quiet); margin-top: .5rem; }
.scr .pb .cta-tag { display: inline-block; margin-top: .625rem; font-size: .6875rem; font-weight: 550; padding: .25rem .5rem; border-radius: 4px; }
.scr .pb .bagnote { margin-top: 1rem; font-size: .75rem; line-height: 1.6; color: var(--pb-quiet); max-width: 76ch; }
.scr .pb .l-lede { max-width: 58ch; font-size: 1.0625rem; line-height: 1.6; color: var(--pb-muted); margin: 0; }
/* Redesign path: one --frag-tone per fragment carries the palette the shipped
   inline styles paint, and the two layout values they also carry (first-row
   margin, the clock fragment's horizontal nested block) become named classes. */
.scr .pb .frag[data-tone="warn"] { --frag-tone: var(--color-warn); }
.scr .pb .frag[data-tone="action"] { --frag-tone: var(--color-action); }
.scr .pb .frag[data-tone="danger"] { --frag-tone: var(--color-danger); }
.scr .pb .frag[data-tone="ok"] { --frag-tone: var(--color-ok); }
.scr .pb .frag[data-tone="quiet"] { --frag-tone: var(--color-muted); }
.scr .pb .frag[data-tone] .frag-k > span:first-child { color: var(--frag-tone); }
.scr .pb .frag[data-tone] .frag-k > .r-dot { background: transparent; }
.scr .pb .frag[data-tone] .nested { background: color-mix(in srgb, var(--frag-tone) 9%, transparent); }
.scr .pb .frag[data-tone] .nested.nested-row { display: flex; gap: 1.25rem; align-items: center; }
.scr .pb .frag[data-tone] .big { font-size: 2rem; color: var(--frag-tone); margin: 0; }
.scr .pb .frag[data-tone] .big span { font-size: .5em; letter-spacing: .1em; }
.scr .pb .frag[data-tone] .mrow .ar { color: var(--frag-tone); }
.scr .pb .frag[data-tone] .mrow .ar[data-tone="warn"] { color: var(--color-warn); }
.scr .pb .frag[data-tone] .mrow .ar[data-tone="danger"] { color: var(--color-danger); }
.scr .pb .frag[data-tone] .mrow-gap { margin-top: .5rem; }
.scr .pb .frag[data-tone] .mrow-gap-2 { margin-top: .625rem; }
.scr .pb .frag[data-tone] .note .mk { color: var(--frag-tone); }
.scr .pb .frag[data-tone] .cta-tag { background: var(--frag-tone); color: var(--pb-on-key); }
/* shipped supported-stacks grid — site.css 141-148. data-status="proving-first"
   and data-status="planned" stay unstyled here on purpose: no stylesheet in the
   repo defines them, so the only visual difference between proven and planned is
   the is-ok class. */
.scr .pb .figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--pb-line-soft); border: var(--pb-rail); margin: .5rem 0 0; }
.scr .pb .figures > div { background: var(--pb-bg); padding: 1rem 1.125rem; }
.scr .pb .figures dt { font-family: var(--font-mono); font-size: .625rem; letter-spacing: .14em; text-transform: uppercase; color: var(--pb-quiet); }
.scr .pb .figures .fig-value { margin: .375rem 0 .25rem; font-family: var(--font-mono); font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.scr .pb .figures .fig-note { margin: 0; font-size: .75rem; line-height: 1.5; color: var(--pb-muted); }
.scr .pb .figures .is-ok .fig-value { color: var(--pb-ok); }
.scr .pb .figures .is-warn .fig-value { color: var(--pb-warn); }
.scr .pb .figures .is-danger .fig-value { color: var(--pb-danger); }
/* Redesign path: the status vocabulary comes from the shared token layer, so a
   proven stack and a planned one differ by tone rather than by one ad-hoc class.
   "roadmap" is deliberately quiet — it does not borrow the failure tint the app
   side gives the same rows. */
.scr .pb .figures > div[data-tone="ok"] .fig-value { color: var(--color-ok); }
.scr .pb .figures > div[data-tone="roadmap"] .fig-value { color: var(--color-muted); font-weight: 500; }

/* --- the floor, applied where a redesign reuses a shipped class name --------
   A redesign that keeps a class has to keep its size too, otherwise the retired
   10 / 10.5px tiers survive here purely by inheritance. Every rule below is scoped
   to the Redesigned variant: the as-is frame keeps the shipped 10px / 10.5px /
   0.5625rem, the redesigned frame shows the floor, and flipping the toggle is the
   comparison. In the repo this is one edit per tier — workspace.css 52, 88, 169,
   358, 448, 482, 533, 605 and the matching rem steps in site.css — not a new
   vocabulary, which is why the annotations argue for changing the classes rather
   than restyling the screens that use them. */
.scr[data-variant="redesign"] .kicker,
.scr[data-variant="redesign"] .kind-kicker,
.scr[data-variant="redesign"] .detail-toggle { font-size: var(--r-label); }

.scr[data-variant="redesign"] .pill,
.scr[data-variant="redesign"] .mono-id,
.scr[data-variant="redesign"] .row-status,
.scr[data-variant="redesign"] .stale-chip { font-size: var(--r-meta); }

/* Landing: .625rem / .65625rem / .5625rem is 10px, 10.5px and 9px — the exact band
   the site stylesheet argues nothing readable should live in. Marks that carry a
   verdict (✓, ✕, →) are treated as text, not decoration, because they are the only
   signal for the row they sit in. */
.scr[data-variant="redesign"] .pb .figures dt,
.scr[data-variant="redesign"] .pb .l-foot-links a,
.scr[data-variant="redesign"] .pb .l-mbar span,
.scr[data-variant="redesign"] .pb .fresh,
.scr[data-variant="redesign"] .pb .demo-banner,
.scr[data-variant="redesign"] .pb .shot .bar span,
.scr[data-variant="redesign"] .pb .locked li i,
.scr[data-variant="redesign"] .pb .pill,
.scr[data-variant="redesign"] .pb .chip,
.scr[data-variant="redesign"] .pb .chip b { font-size: var(--r-meta); }

.scr[data-variant="redesign"] .pb .mrow .ar,
.scr[data-variant="redesign"] .pb .note .mk { font-size: var(--r-label); }

/* ============================================================================
   6. MOBILE VARIANT — explicit rules instead of @media, because the board
   renders a 390px screen inside a wide page. For the landing these mirror the
   shipped breakpoints that a 390px frame falls inside — site.css 200-243 uses
   1080 / 860 / 640 / 390, there is no 767px rule anywhere in the stylesheet.
   ========================================================================== */
.scr--mobile .aside {
  position: absolute;
  inset: 0;
  width: 100%;
  max-width: none;
  min-width: 0;
  border-right: none;
  background: var(--color-ink);
  z-index: 2;
}

.scr--mobile .shell-body, .scr--mobile .r-body { position: relative; }

.scr--mobile .bottom-nav {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--color-line-soft);
  background: var(--color-panel);
}

.scr--mobile .bottom-nav .tab-btn {
  border: none;
  border-radius: 0;
  text-align: center;
  padding: .6rem 0;
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .14em;
}

.scr--mobile .bottom-nav .tab-btn[aria-selected="true"] {
  background: transparent;
  color: var(--color-action);
  box-shadow: inset 0 2px 0 var(--color-action);
}

.scr--mobile .channel-pane[data-hidden="true"] { display: none; }
.scr--mobile .aside[data-collapsed="true"] { display: none; }
.scr--mobile .topbar { gap: .45rem; padding: .5rem .7rem; }
.scr--mobile .project-select-wrap { flex-basis: 100%; order: 3; max-width: none; }
.scr--mobile .r-subnav { width: 100%; flex: 0 0 auto; border-right: 0; border-bottom: 1px solid var(--color-line-soft); grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
.scr--mobile .pb .l-nav { display: none; }
/* site.css 200-242 — the 1080 / 860 / 640 / 390 blocks the mobile frame falls
   into. Every rule carries .pb so it matches the specificity of the shipped
   landing rule it is overriding. */
.scr--mobile .pb { --pb-gutter: 14px; }
.scr--mobile .pb .l-hero, .scr--mobile .pb .l-close, .scr--mobile .pb .l-band-head { grid-template-columns: minmax(0, 1fr); }
.scr--mobile .pb .l-hero h1 { font-size: 2.5rem; }
.scr--mobile .pb .l-hero-l { border-right: 0; border-bottom: var(--pb-rail); }
.scr--mobile .pb .l-close-l { border-right: 0; border-bottom: var(--pb-rail); }
.scr--mobile .pb .l-band-head { gap: 1.25rem; }
.scr--mobile .pb .figures { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.scr--mobile .pb .act-grid { grid-template-columns: minmax(0, 1fr); }
.scr--mobile .pb .l-spine { grid-template-columns: minmax(0, 1fr); }
.scr--mobile .pb .l-spine .l-spine-rail { display: none; }
.scr--mobile .l-band { padding-block: 3.5rem; }
.scr--mobile .pb .honest { grid-template-columns: minmax(0, 1fr); }
.scr--mobile .pb .honest > div { border-left: 0; border-top: var(--pb-rail); }
.scr--mobile .pb .honest > div:first-child { border-top: 0; }
.scr--mobile .pb .locked { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
.scr--mobile .pb .stackgrid { grid-template-columns: minmax(0, 1fr); }
.scr--mobile .pb .stackgrid .frag { grid-column: auto; }
.scr--mobile .pb .mobile-shot { margin: 1.25rem auto 0; }
.scr--mobile .pb .l-hero-l, .scr--mobile .pb .l-hero-r { padding-block: 2.75rem; }
.scr--mobile .pb .l-top { gap: .625rem; }
.scr--mobile .pb .l-cta { gap: .625rem; }
.scr--mobile .pb .l-top .l-link-quiet { display: none; }
.scr--mobile .pb .hero-cta .l-btn, .scr--mobile .pb .hero-cta .r-btn { flex: 1 1 auto; justify-content: center; }
.scr--mobile .dim-grid { grid-template-columns: minmax(0, 1fr); }
.scr--mobile .r-card, .scr--mobile .inspector-row { scroll-margin-top: 4rem; }

/* ============================================================================
   7. BOARD RESPONSIVE + MOTION
   ========================================================================== */
@media (max-width: 1240px) {
  :root { --rail-w: 236px; --side-w: 312px; }
}

@media (max-width: 1040px) {
  .board {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto auto;
    height: auto;
  }
  .rail { grid-column: 1; border-right: 0; border-bottom: 1px solid var(--color-line-soft); max-height: 240px; }
  .stage-wrap { grid-column: 1; min-height: 70vh; }
  .side { grid-column: 1; border-left: 0; border-top: 1px solid var(--color-line-soft); }
  /* Stacked, a collapsed panel has no track to shrink into, so it leaves the flow. */
  .board[data-rail="closed"] .rail,
  .board[data-side="closed"] .side { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="board" data-component="caddie-ui-review-board">

  <header class="board-head" data-component="board-controls">
    <div class="board-title">
      <span class="mark">CADDIE<b>·</b>UI</span>
      <span class="sub">A–Z review board · replica of the interface shipped in <code>apps/app/src/client</code> + <code>apps/site</code></span>
    </div>

    <div class="controls" data-component="board-control-group">
      <div class="control-group">
        <p class="control-label">Variant</p>
        <div class="seg" id="seg-variant" role="group" aria-label="Comparison variant">
          <button type="button" data-v="asis" aria-pressed="true">As-is</button>
          <button type="button" data-v="redesign" aria-pressed="false">Redesigned</button>
        </div>
      </div>
      <div class="control-group">
        <p class="control-label">Data</p>
        <div class="seg" id="seg-data" role="group" aria-label="Data state">
          <button type="button" data-d="populated" aria-pressed="true">Populated</button>
          <button type="button" data-d="empty" aria-pressed="false">First-run</button>
        </div>
      </div>
      <div class="control-group">
        <p class="control-label">Frame</p>
        <div class="seg" id="seg-frame" role="group" aria-label="Viewport frame">
          <button type="button" data-f="desktop" aria-pressed="true">1440</button>
          <button type="button" data-f="mobile" aria-pressed="false">390</button>
        </div>
      </div>
      <div class="control-group">
        <p class="control-label">Zoom</p>
        <div class="seg" id="seg-zoom" role="group" aria-label="Frame zoom">
          <button type="button" data-z="fit" aria-pressed="false">Fit</button>
          <button type="button" data-z="width" aria-pressed="true">Width</button>
          <button type="button" data-z="actual" aria-pressed="false">1:1</button>
        </div>
      </div>
      <div class="control-group">
        <p class="control-label">Panels</p>
        <button type="button" class="board-btn" data-act="focus" aria-pressed="false"
          title="Collapse both panels and give the stage the full width · backslash">Focus</button>
      </div>
      <div class="control-group">
        <p class="control-label">Theme</p>
        <div class="seg" id="seg-theme" role="group" aria-label="Appearance">
          <button type="button" data-t="dark" aria-pressed="true">Dark</button>
          <button type="button" data-t="light" aria-pressed="false">Light</button>
        </div>
      </div>
      <span class="board-note" id="frame-meta">1440 × 900</span>
      <span class="board-note" id="decision-count">0 / 19 decided</span>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Screens A to Z" data-component="screen-rail"></nav>

  <main class="stage-wrap">
    <div class="screen-head" id="screen-head" data-component="screen-header"></div>
    <div class="stage" id="stage" data-zoom="width">
      <div class="screen-frame" id="screen-frame"></div>
    </div>
    <p class="frame-caption" id="frame-caption"></p>
    <button type="button" class="edge-toggle edge-left" data-act="panel" data-panel="rail"
      aria-controls="rail" aria-expanded="true" aria-label="Hide the A to Z screen list">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
      <span class="edge-key" aria-hidden="true">[</span>
    </button>
    <button type="button" class="edge-toggle edge-right" data-act="panel" data-panel="side"
      aria-controls="side" aria-expanded="true" aria-label="Hide the review notes">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
      <span class="edge-key" aria-hidden="true">]</span>
    </button>
  </main>

  <aside class="side" id="side" aria-label="Review notes and decision" data-component="side-panel"></aside>
</div>

<script>
/* ============================================================================
   BOARD STATE — in memory only. No localStorage / sessionStorage: those APIs
   are unavailable in this environment and the plan forbids depending on them.
   ========================================================================== */
const S = {
  screen: "00-overview",
  variant: "asis",
  data: "populated",
  frame: "desktop",
  /* Width is the default because filling the stage is the closest thing this board
     has to "the app, at the size the app renders". Fit stays available for judging
     a whole composition at once, 1:1 for reading type at shipped size. */
  zoom: "width",
  theme: "dark",
  railOpen: true,
  sideOpen: true,
  asideTab: "brief",
  expanded: {},
  decisions: {},
};

const ic = (d, label) =>
  `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${label}"><path d="${d}"/></svg>`;

/* Provider marks exactly as client/auth.ts draws them: the Google glyph keeps
   its four brand fills on any theme (read from the --brand-google-* aliases),
   the GitHub mark follows currentColor so it reads on both halo themes. */
const providerMark = (which, size = 18) => which === "google"
  ? `<svg class="provider-mark" width="${size}" height="${size}" viewBox="0 0 18 18" role="img" aria-label="Google">
      <path fill="var(--brand-google-blue)" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/>
      <path fill="var(--brand-google-green)" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26a5.4 5.4 0 0 1-8.09-2.85H.96v2.33A9 9 0 0 0 9 18z"/>
      <path fill="var(--brand-google-yellow)" d="M3.96 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/>

const statusIcon = (s) =>
  s === "needs-you" ? ICON.alert("needs you") :
  s === "changed" ? ICON.diff("changed") :
  s === "handled" ? ICON.check("handled") :

const kindIcon = (k) =>
  k === "Approval" ? ICON.shield("approval") :
  k === "Change" ? ICON.diff("change") :
  k === "Clock" ? ICON.clock("clock") :
  ICON.box("result");

const DIMENSIONS = [
  ["Philosophy consistency", 6, "One identity is declared and mostly kept: <code>tokens.css</code> names every color by role, <code>workspace.css</code> contains zero color literals, and mono uppercase kickers carry the same voice across Brief, Runs and Channel. The thesis breaks on four surfaces — <code>evidence/Drawer.tsx</code>, <code>discovery/Results.tsx</code>, <code>judge/Scorecard.tsx</code> and <code>submission/Package.tsx</code> — which carry 71 hard-coded hex literals between them (15, 17, 21, 18) and set <code>fontFamily: 'system-ui, sans-serif'</code> on their root section, so they sit outside the halo palette and outside the type system at the same time. That drift is no longer latent: three of the four are routed and linked from the shell, so a signed-in user can reach it today. And the count is the weaker half of the finding. The sharpest one is a single missing declaration repeated five times across those four files — <code>Results 209</code>, <code>Scorecard 223</code>, <code>Package 283</code> and <code>337</code>, <code>Drawer 147</code> each set a background tint and never a colour, so the label inherits <code>body</code>'s <code>--color-bright</code> and lands at 1.01–1.11:1. Five badges, four files, one absent property: the status text on the parts of the product that explain what was actually verified is the least readable text in it."],
  ["Visual hierarchy", 5, "The decision-card grammar is genuinely good: kind kicker, status pill, headline, summary, one primary action, details behind a toggle. But the flagship workspace ships empty — <code>Shell.tsx</code> passes <code>cards={[]}</code> and the Channel gets <code>standbySource</code> — so the strongest hierarchy in the product is never actually seen. On the screens that do exist, actions never outrank chrome: the four inline-styled surfaces render their controls as unstyled <code>&lt;button&gt;</code> elements at equal weight, and <code>DesignReview.tsx</code> puts Approve and Reject side by side in the same <code>.btn-ghost</code>, <code>Schedules.tsx</code> puts Run now and Pause in <code>.detail-toggle</code>, which is the class for a borderless disclosure label."],
  ["Detail execution", 5, "Radius, leading and tracking are disciplined (0.12em on uppercase kickers, −0.01em on card headlines, a 78ch transcript measure). Three misses are systemic rather than local. <b>There is no type floor</b>: <code>workspace.css</code> declares 25 pixel font sizes and 13 of them are 11px or smaller — 10px for the mobile tab label (358), the staleness chip (448) and every row's state word (605), 10.5px for the kicker (52), pill (88), mono id (169), kind kicker (482) and detail toggle (533) — and <code>site.css</code> resolves 19 of its 35 rem steps at or below 11px, bottoming out at <code>0.5625rem</code>, which is 9px on a page that never sets a root size. <b>Controls carry no colour</b>: 18 classless <code>&lt;button&gt;</code> elements across five files — Package 7, Results 4, Scorecard 3, RepositoryPicker 3, Drawer 1 — land on the user-agent's grey fill with <code>body</code>'s near-white text because <code>workspace.css 29-34</code> resets <code>font</code> and <code>color</code> to <code>inherit</code>: measured 1.06:1. <b>The marks are improvised</b>: interface icons are Unicode glyphs (<code>▸ ⟳ ☀ ☾ ⇥</code>, including the theme toggle at <code>Shell.tsx 320</code>) that shift size and baseline between machines, while <code>ibm-plex-mono</code> is self-hosted at 400/500 and ten selectors ask for 600 or 700, so every bold uppercase kicker on the page is a synthesised bold rather than a cut that exists."],

e strongest hierarchy in the product is the one a real account never sees, and deep-linking is limited to <code>?project=</code>. One honesty note about this board itself: the Drawer screen is classified DOCUMENTATION ONLY — its service layer is LOCAL VERIFIED, its render has no evidence at all, which is exactly the risk the harness-mounted components illustrate."],

const bandFor = (n) => (n <= 4 ? "Broken" : n <= 6 ? "Functional" : n <= 8 ? "Strong" : "Exceptional");

function radarSVG(scores) {
  const cx = 110, cy = 104, r = 78;
  const pt = (i, frac) => {
    const ang = (-90 + i * 72) * (Math.PI / 180);
    return [cx + Math.cos(ang) * r * frac, cy + Math.sin(ang) * r * frac];
  };
  const rings = [0.25, 0.5, 0.75, 1].map((f) =>
    `<polygon points="${scores.map((_, i) => pt(i, f).map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-opacity="${f === 1 ? ".3" : ".12"}" stroke-width="1"/>`).join("");
  const axes = scores.map((_, i) => {
    const [x, y] = pt(i, 1);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity=".14"/>`;
  }).join("");
  const shape = scores.map((s, i) => pt(i, s / 10).map((v) => v.toFixed(1)).join(",")).join(" ");
  const dots = scores.map((s, i) => {
    const [x, y] = pt(i, s / 10);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="currentColor"/>`;
  }).join("");
  const labels = ["PHIL", "HIER", "DETAIL", "FUNC", "INNOV"].map((l, i) => {
    const [x, y] = pt(i, 1.24);
    return `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" font-size="11" letter-spacing=".5" fill="currentColor" fill-opacity=".72">${l}</text>`;
  }).join("");
  return `<svg viewBox="-14 -2 248 218" role="img" aria-label="Radar chart of the five review dimensions">${rings}${axes}<polygon points="${shape}" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-opacity=".85" stroke-width="1.4"/>${dots}${labels}</svg>`;
}

    ? `<div class="r-run" data-status="${r.status}"${i === current ? ' aria-current="true"' : ""}>
        <span class="glyph">${r.status === "running" ? ICON.play() : r.status === "completed" ? ICON.check() : r.status === "failed" ? ICON.alert() : ICON.stop()}</span>

function channelBody(v, populated) {
  if (!populated) {
    if (v === "redesign") {
      return `<div class="r-transcript">
        <div class="r-settle"><b>Transport is not connected in this build.</b><span>Below is what a first message does, using simulated text.</span></div>
        <div class="r-turn" data-author="assistant">
          <span class="turn-label">${ICON.sparkCheck("caddie")} Caddie · first run</span>
          <div class="bubble"><p>Describe what you want in plain terms. I will write a plan revision, pin every claim I make to a source, and stop at the design gate before building anything.</p><p>Two useful first moves: ask me to re-read a rules page you suspect has changed, or arm a weekly sweep in Schedules.</p></div>
        </div>
      </div>`;
    }
    return statePanel("offline", "Channel standby", "No conversation yet. The transport that streams run output into this pane is delivered separately and is not connected here.", "");
  }
  const turns = SC.transcript.map((m, i) => {
    if (m.a === "user") return v === "redesign"
      ? `<div class="r-turn" data-author="user"><span class="turn-label">You · ${"09:0" + i}</span><div class="bubble">${m.t}</div></div>`
      : `<div class="msg user">${m.t}</div>`;
    if (m.a === "assistant") return v === "redesign"
      ? `<div class="r-turn" data-author="assistant"><span class="turn-label">${ICON.sparkCheck()} Caddie · specialist build-repair · ${"09:0" + i}</span><div class="bubble"><p>${m.t}</p></div></div>`
      : `<div class="msg assistant"><div style="font-size:13px;line-height:1.6">${m.t}</div></div>`;
    if (m.a === "tool") return v === "redesign"
      ? `<div class="r-tool" data-state="${m.state}"><span>${m.state === "running" ? ICON.play() : ICON.check()}</span><span>${m.name} → ${m.out}</span><span class="mono-id">${m.state}</span></div>`
      : `<div class="tool-banner" data-state="${m.state === "running" ? "input-available" : "output-available"}">[${m.name}] ${m.state === "running" ? "working" : "done"}</div>`;
    if (m.a === "banner") return v === "redesign"
      ? `<div class="r-settle"><b>${m.t.split(" · ")[0]}</b><span>${m.t.split(" · ").slice(1).join(" · ")}</span></div>`
      : `<div class="settlement-banner" data-outcome="stopped">run stopped — submission sub_8d13 stopped; no result was produced</div>`;
    if (m.a === "draft") {
      const held = m.state !== "cancelled";
      /* As-is keeps only the queued draft, so a discard vanishes without a trace.
         The redesigned transcript keeps both, named by what actually happened. */
      if (v !== "redesign") return held
        ? `<div class="draft-row" data-state="${m.state}"><span class="kicker">unsent draft</span><span class="draft-text">${m.t}</span><span class="mono-id">idem ${m.key}</span><div class="draft-actions"><button class="btn-ghost">Send</button><button class="btn-ghost">Discard</button></div></div>`
        : "";
      return `<div class="r-draft" data-state="${m.state}"><span class="turn-label">${ICON.memory()} ${held ? "unsent draft · held until you send" : "discarded draft · never sent, kept as a trace"}</span><span class="d-text">${m.t}</span><span class="d-key">idempotency key ${m.key}</span><div class="draft-actions">${held ? `<button class="r-btn" data-tone="primary">Send</button><button class="r-btn">Edit</button><button class="r-btn">Discard</button>` : `<button class="r-btn">Restore as a new draft</button>`}</div></div>`;
    }
    return "";
  }).join("");
  return `<div class="${v === "redesign" ? "r-transcript" : "transcript"}" data-component="channel-transcript">${turns}</div>`;
}

function asideTabs(v) {
  const tab = S.asideTab;
  return `<div class="aside-tabs" role="tablist" data-component="lane-tabs">
    <button class="tab-btn" role="tab" aria-selected="${tab === "brief"}" data-act="tab" data-tab="brief">Brief</button>
    <button class="tab-btn" role="tab" aria-selected="${tab === "runs"}" data-act="tab" data-tab="runs">Runs</button>
  </div>`;
}

  const sw = mobile ? 390 : s.sw;
  const sh = mobile ? Math.min(844, s.sh) : s.sh;
  const availW = stage.clientWidth - 32;
  /* The caption sits outside the stage, so it no longer costs the frame any height. */
  const availH = stage.clientHeight - 32;
  /* Fit keeps the whole drawing visible; Width fills the stage and scrolls, which
     is how the screen behaves in a real browser; 1:1 refuses to shrink the frame
     at all, so the replica reads at the size its own CSS produces. Nothing is
     ever scaled above 1 — enlarging a replica invents a design that is not there. */
  const scale = S.zoom === "actual" ? 1
    : S.zoom === "width" ? Math.min(availW / sw, 1)
      : Math.min(availW / sw, availH / sh, 1);
  stage.dataset.zoom = S.zoom;
  document.getElementById("screen-frame").style.setProperty("--fit", String(scale));
  document.getElementById("frame-meta").textContent = S.zoom === "actual"
    ? `${sw} × ${sh} · 1:1`
    : `${sw} × ${sh} · ${Math.round(scale * 100)}% ${S.zoom}`;
}

/* Appearance is one control surface: eleven seed variables. The board writes
   them inline on <html> only when its own theme choice changes, so an appearance
   preset set from outside (a Nudge control patching the same seeds) survives every
   other re-render instead of being stomped on each time the board repaints. */
const THEME_SEEDS = ["--seed-bg", "--seed-surface", "--seed-raised", "--seed-lift",
  "--seed-fg", "--seed-muted", "--seed-primary", "--seed-primary-deep", "--seed-accent",
  "--seed-ok", "--seed-danger"];
const seedValue = (name, theme) =>
  TOK(`--seed-ref-${theme === "light" ? "light" : "dark"}-${name.replace("--seed-", "")}`);
let ownedTheme = null;

function claimTheme(root) {
  root.setAttribute("data-theme", S.theme);
  root.setAttribute("data-seed-owner", "board");
  if (ownedTheme === S.theme) return;
  THEME_SEEDS.forEach((name) => root.style.setProperty(name, seedValue(name, S.theme)));
  ownedTheme = S.theme;
}

function render() {
  claimTheme(document.documentElement);
  applyChrome();
  renderRail();
  renderHead();
  renderSide();
  renderScreen();
  syncSeg("seg-variant", "variant", "v");
  syncSeg("seg-data", "data", "d");
  syncSeg("seg-frame", "frame", "f");
  syncSeg("seg-zoom", "zoom", "z");
  syncSeg("seg-theme", "theme", "t");
  /* Route links and j/k can land on a screen the rail has scrolled past; keep
     the A–Z list honest about where the review currently is. */
  const active = document.querySelector('#rail [aria-current="true"]');
  if (active) active.scrollIntoView({ block: "nearest" });
}

/* Links inside the redesigned screens name an app path rather than a dead anchor.
   Seven are registered in client/routes.tsx — "/", "/settings", "/onboarding",
   "/discovery", "/judge", "/submission", "/schedules". The other six keys below are
   destinations this review proposes: "/runs" (the Runs lane is a tab, not a route),
   "/sign-in" (auth renders in place), and the four unreachable surfaces —
   "/evidence", "/artifact", "/design-review", "/repositories" — which have a component
   and no route at all. The rail's route column says which is which; a mapping here only
   means clicking the name moves the review instead of dead-ending. */
const ROUTE_TO_SCREEN = {
  "/": "04-workspace",
  "/runs": "07-runs",
  "/evidence": "09-evidence",
  "/artifact": "10-artifact",
  "/design-review": "11-design-review",
  "/repositories": "12-repositories",
  "/discovery": "13-discovery",
  "/schedules": "14-schedules",
  "/settings": "15-settings",
  "/onboarding": "03-onboarding",
  "/sign-in": "02-signin",
  "/judge": "18-judge",
  "/submission": "19-submission",
};

/* Route names on links are app routes; the board has no server, so a route
   resolves to its screen. Unmapped routes fall back to the screen whose id
   ends with the route segment, which keeps a hand-edited link honest instead
   of silently doing nothing. */
function screenForRoute(path) {
  if (ROUTE_TO_SCREEN[path]) return ROUTE_TO_SCREEN[path];
  const seg = path.replace(/^\//, "") || "workspace";
  const hit = SCREENS.find((s) => s.id.endsWith("-" + seg));
  return hit ? hit.id : null;
}

/* Collapsing a panel is a preview control, not a content change: the stage takes
   the freed width, so the frame can be drawn closer to its real size. No
   re-render of the screen is needed, only a re-measure. */
function togglePanel(which) {
  if (which === "side") S.sideOpen = !S.sideOpen;
  else S.railOpen = !S.railOpen;
  applyChrome();
  refitWhile(300);
}

document.addEventListener("click", (ev) => {
  const route = ev.target.closest("[data-route]");
  if (route) {
    ev.preventDefault();
    const target = screenForRoute(route.dataset.route);
    if (target) { S.screen = target; S.expanded = {}; render(); }
    return;
  }
  const t = ev.target.closest("[data-act],[data-v],[data-d],[data-f],[data-z],[data-t]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "panel") { togglePanel(t.dataset.panel); return; }
  if (act === "focus") { collapseBoth(); return; }
  if (act === "screen") { S.screen = t.dataset.id; S.expanded = {}; render(); return; }
  if (act === "v" || t.dataset.v) { if (t.dataset.v) { S.variant = t.dataset.v; render(); } return; }
  if (act === "d" || t.dataset.d) { if (t.dataset.d) { S.data = t.dataset.d; render(); } return; }
  if (t.dataset.f) { S.frame = t.dataset.f; render(); return; }
  if (t.dataset.z) { S.zoom = t.dataset.z; fit(); syncSeg("seg-zoom", "zoom", "z"); return; }
  if (t.dataset.t) { S.theme = t.dataset.t; render(); return; }
  if (act === "tab") { S.asideTab = t.dataset.tab; render(); return; }
  if (act === "expand") { S.expanded[t.dataset.key] = !S.expanded[t.dataset.key]; render(); return; }
  if (act === "dec") { S.decisions[S.screen] = t.dataset.dec; render(); return; }
});

document.addEventListener("keydown", (ev) => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (!ev.target.matches("input, textarea, select")) {
    if (ev.key === "j" || ev.key === "k") {
      const i = SCREENS.findIndex((s) => s.id === S.screen);
      const n = ev.key === "j" ? Math.min(SCREENS.length - 1, i + 1) : Math.max(0, i - 1);
      S.screen = SCREENS[n].id; S.expanded = {}; render(); ev.preventDefault();
    }
    if (ev.key === "v") { S.variant = S.variant === "asis" ? "redesign" : "asis"; render(); }
    if (ev.key === "e") { S.data = S.data === "populated" ? "empty" : "populated"; render(); }
    if (ev.key === "t") { S.theme = S.theme === "dark" ? "light" : "dark"; render(); }
    if (ev.key === "z") {
      const order = ["fit", "width", "actual"];
      S.zoom = order[(order.indexOf(S.zoom) + 1) % order.length];
      fit(); syncSeg("seg-zoom", "zoom", "z");
    }
    /* Panels are the preview size control, so they get the bracket keys. */
    if (ev.key === "[") togglePanel("rail");
    if (ev.key === "]") togglePanel("side");
    if (ev.key === "\\") collapseBoth();
  }
});

window.addEventListener("resize", fit);
render();

</script>
</body>
</html>
